/* ================= REPORTS ================= */
const TYPE_L = { IN: 'Penerimaan', TRF_OUT: 'Transfer keluar', TRF_IN: 'Transfer masuk', USE: 'Pemakaian', SCRAP: 'Scrap', ADJ: 'Penyesuaian opname', PROD_USAGE: 'Pemakaian produksi', PROD_OUTPUT: 'Hasil produksi', RELOCATE: 'Pindah rak' };
function reportData() {
  const r = F.rep; const since = today0() - (+r.days) * DAY; const wf = x => !r.wid || x === +r.wid; const pm = pid => prodMatch(P(pid), r);
  const grouped = (items, valIdx, label) => { const g = {}; items.forEach(x => { const k = groupOf(r.group, x.p, x.w); (g[k] ||= { k, ps: new Set(), v: 0, n: 0 }); g[k].ps.add(x.p.id); g[k].v += x.v; g[k].n += x.n || 0; }); const tot = Object.values(g).reduce((a, x) => a + x.v, 0); return Object.values(g).sort((a, b) => b.v - a.v).map(x => [x.k, x.ps.size, x.n, x.v, tot ? x.v / tot * 100 : 0]); };
  const gl = (GROUPS.find(g => g[0] === r.group) || ['', 'Gudang'])[1];
  if (r.tab === 'valuasi') {
    const items = []; for (const w of actW().filter(w => wf(w.id))) for (const p of S.products.filter(p => prodMatch(p, r))) { const bs = S.batches.filter(b => b.productId === p.id && b.warehouseId === w.id && b.qty > 1e-9); if (!bs.length) continue; const q = bs.reduce((a, b) => a + b.qty, 0), v = bs.reduce((a, b) => a + b.qty * b.cost, 0); items.push({ p, w, q, v, n: bs.length }); }
    if (r.group) return { head: [gl, 'Produk', 'Batch', 'Nilai FIFO', 'Porsi'], num: [1, 2, 3, 4], money: [3], share: [4], rows: grouped(items), total: 3 };
    return { head: ['Gudang', 'Kode', 'Produk', 'Merek', 'Jenis', 'Subkategori', 'Qty', 'Satuan', 'Batch', 'HPP rata-rata', 'Nilai FIFO'], num: [6, 8, 9, 10], money: [9, 10], total: 10,
      rows: items.map(x => [x.w.name, x.p.code, x.p.name, BR(x.p.brandId)?.name || '–', TY(x.p.typeId)?.name || '–', catPath(x.p.categoryId), x.q, x.p.baseUom, x.n, x.v / x.q, x.v]) };
  }
  if (r.tab === 'kartu') {
    const rows = S.movements.filter(m => m.ts >= since && m.ref !== 'RIWAYAT' && wf(m.warehouseId) && (!r.pid || m.productId === +r.pid) && pm(m.productId)).sort((a, b) => b.ts - a.ts).slice(0, 500).map(m => { const p = P(m.productId); return [fdt(m.ts), W(m.warehouseId)?.name, p.name, TYPE_L[m.type] || m.type, m.batchNo, m.qty, p.baseUom, m.cost, m.qty * m.cost, m.ref, m.user]; });
    return { head: ['Waktu', 'Gudang', 'Produk', 'Jenis transaksi', 'Batch', 'Qty', 'Satuan', 'HPP/satuan', 'Nilai', 'Referensi', 'Oleh'], num: [5, 7, 8], money: [7, 8], rows, note: 'Maks. 500 baris terbaru. Riwayat pemakaian demo (sebelum aplikasi dipakai) tidak ditampilkan per baris.' };
  }
  if (r.tab === 'hpp') {
    const agg = {}; S.movements.filter(m => m.type === 'USE' && m.ts >= since && wf(m.warehouseId) && pm(m.productId)).forEach(m => { const k = m.warehouseId + '|' + m.productId; (agg[k] ||= { w: W(m.warehouseId), p: P(m.productId), q: 0, v: 0, n: 0 }); agg[k].q += -m.qty; agg[k].v += -m.qty * m.cost; });
    const items = Object.values(agg);
    if (r.group) return { head: [gl, 'Produk', '', 'HPP', 'Porsi'], num: [1, 3, 4], money: [3], share: [4], rows: grouped(items).map(x => { x[2] = ''; return x; }), total: 3 };
    return { head: ['Gudang', 'Kode', 'Produk', 'Merek', 'Subkategori', 'Qty terpakai', 'Satuan', 'HPP'], num: [5, 7], money: [7], total: 7, rows: items.sort((a, b) => b.v - a.v).map(a => [a.w.name, a.p.code, a.p.name, BR(a.p.brandId)?.name || '–', catPath(a.p.categoryId), a.q, a.p.baseUom, a.v]) };
  }
  if (r.tab === 'anomali') {
    const tol = S.settings.priceTolerance; const rows = [];
    S.movements.filter(m => m.type === 'IN' && m.ref !== 'SALDO-AWAL' && m.ts >= since && pm(m.productId)).forEach(m => { const p = P(m.productId); const dev = (m.cost - p.refPrice) / p.refPrice * 100; if (p.refPrice && Math.abs(dev) > tol) rows.push([fdt(m.ts), 'Penerimaan', m.ref || '–', p.name, m.cost, p.refPrice, dev, m.user]); });
    S.pos.filter(po => po.status !== 'batal' && (po.orderedAt || po.createdAt) >= since).forEach(po => po.lines.forEach(l => { const p = P(l.productId); if (!prodMatch(p, r)) return; const dev = lineDev(l); if (Math.abs(dev) > tol) rows.push([fdt(po.orderedAt || po.createdAt), 'Purchase order', po.no, p.name, l.price * (1 - (l.disc || 0) / 100) / l.factor, p.refPrice, dev, po.createdBy]); }));
    return { head: ['Waktu', 'Sumber', 'Dokumen', 'Produk', 'Harga/satuan dasar', 'Referensi', 'Selisih %', 'Oleh'], num: [4, 5, 6], money: [4, 5], pct: [6], rows, note: `Transaksi dengan harga lebih dari ${tol}% di atas atau di bawah harga referensi. Eksekusi tidak diblokir; pemeriksaan dilakukan lewat laporan ini.` };
  }
  const rows = S.scraps.filter(s => s.createdAt >= since && wf(s.warehouseId)).map(s => [fdt(s.createdAt), s.no, W(s.warehouseId).name, s.source === 'transit' ? 'Selisih transit' : 'Manual', s.reason, SC_ST[s.status][0], scrapVal(s)]);
  return { head: ['Waktu', 'No.', 'Gudang', 'Sumber', 'Alasan', 'Status', 'Nilai'], num: [6], money: [6], rows, total: 6 };
}
V.reports = () => {
  const r = F.rep; const d = reportData();
  const fmt = (v, i) => d.money?.includes(i) ? rp(v) : d.share?.includes(i) ? `${v.toFixed(1)}%` : d.pct?.includes(i) ? `${v > 0 ? '+' : ''}${v.toFixed(1)}%` : d.num?.includes(i) ? num(v) : esc(v);
  const rows = d.rows.map(row => `<tr>${row.map((v, i) => `<td class="${d.num?.includes(i) ? 'n' : ''}">${fmt(v, i)}</td>`).join('')}</tr>`);
  const foot = d.total != null && d.rows.length ? `<tfoot><tr><td colspan="${d.total}">Total</td><td class="n">${rp(d.rows.reduce((a, x) => a + x[d.total], 0))}</td>${d.head.length - d.total - 1 > 0 ? `<td colspan="${d.head.length - d.total - 1}"></td>` : ''}</tr></tfoot>` : '';
  return `<div class="toolbar">${seg('rep.tab', r.tab, [['valuasi', 'Valuasi stok'], ['kartu', 'Kartu stok'], ['hpp', 'HPP pemakaian'], ['anomali', 'Anomali harga'], ['scrap', 'Scrap & selisih']])}</div>
  <div class="toolbar">${fld('Gudang', whSel('rep.wid', r.wid, S.warehouses, { rr: 1, blank: 'Semua gudang' }))}
  ${r.tab === 'kartu' ? fld('Produk', `<select data-bind="rep.pid" data-rr>${opt('', 'Semua produk', r.pid)}${S.products.map(p => opt(p.id, p.name, r.pid)).join('')}</select>`) : ''}
  ${r.tab !== 'valuasi' ? fld('Periode', `<select data-bind="rep.days" data-rr>${[['7', '7 hari'], ['30', '30 hari'], ['90', '90 hari'], ['365', '1 tahun']].map(([v, l]) => opt(v, l, r.days)).join('')}</select>`) : ''}
  ${['valuasi', 'hpp'].includes(r.tab) ? groupSel('rep.group', r.group) : ''}
  <div class="sp"></div>${btn('Unduh Excel', 'repExport', {}, { perm: 'report' })}</div>
  ${r.tab !== 'scrap' ? `<div class="toolbar filters">${prodFilters('rep')}${(r.c1 || r.type || r.brand) ? btn('Hapus filter', 'clearProdF', { k: 'rep' }, { k: 'sm' }) : ''}</div>` : ''}
  ${tbl(d.head.map((h, i) => d.num?.includes(i) ? [h, 'n'] : h), rows, { foot, empty: 'Tidak ada data untuk filter ini.' })}${d.note ? `<p class="note">${d.note}</p>` : ''}`;
};
A.repExport = () => { const d = reportData(); if (d.share) d.rows = d.rows.map(x => x.map((v, i) => d.share.includes(i) ? Math.round(v * 10) / 10 : v)); xlsxSave(`laporan-${F.rep.tab}-${isoDate(Date.now())}.xlsx`, [[PAGES.reports[0] + ' ' + F.rep.tab, [d.head, ...d.rows.map(r => r.map(v => typeof v === 'number' ? Math.round(v * 100) / 100 : v))]]]); };

  const f = F.aud; const acts = [...new Set(S.audit.map(a => a.action))].sort(); const users = [...new Set(S.audit.map(a => a.user_id))].sort(); const q = (f.q || '').toLowerCase();

let ME = null, CFG = {}, VER = 0, PENDING_AUD = [], saving = false, dirty = false, saveTimer = null, errBackoff = 0;
async function api(method, path, body) {
  let r;
  try { r = await fetch(path, { method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { const er = new UserError('Server tidak bisa dihubungi. Periksa jaringan.'); er.status = 0; throw er; }
  let data = null; try { data = await r.json(); } catch (e) { }
  if (r.status === 401 && path !== '/api/auth/login') { showLogin('Sesi berakhir. Silakan masuk lagi.'); const er = new UserError('Sesi berakhir.'); er.status = 401; throw er; }
  if (!r.ok) { const er = new UserError(typeof data?.detail === 'string' ? data.detail : `Permintaan gagal (${r.status}).`); er.status = r.status; throw er; }
  return data;
}
function audit(action, endpoint, before, after, sysUser) {
  const e = { timestamp: new Date().toISOString(), user_id: sysUser || cur().username, role: sysUser ? 'system' : cur().role, action, endpoint, payload_before: before == null ? null : clone(before), payload_after: after == null ? null : clone(after) };
  S.audit.unshift(e); if (S.audit.length > 3000) S.audit.length = 3000; PENDING_AUD.push(e);
}
function load() { return false; }
function save() { if (!ME || !S) return; dirty = true; setSync('saving'); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300 + errBackoff); }
async function flush() {
  if (saving || !dirty) return; saving = true; dirty = false;
  const aud = PENDING_AUD.splice(0); const { users, currentUserId, ui, ...data } = S;
  try { const r = await api('PUT', '/api/state', { version: VER, data, audit: aud }); VER = r.version; errBackoff = 0; setSync(dirty ? 'saving' : 'ok'); }
  catch (e) {
    if (e.status === 409) { dirty = false; PENDING_AUD.length = 0; await pullState(); closeModal(); render(); toast('Data baru saja diubah pengguna lain dan sudah dimuat ulang. Perubahan terakhir Anda tidak tersimpan, silakan ulangi.', 'err'); }
    else if (e.status !== 401) { PENDING_AUD.unshift(...aud); dirty = true; errBackoff = Math.min(15000, (errBackoff || 1000) * 2); setSync('err'); }
  } finally { saving = false; if (dirty) saveTimer = setTimeout(flush, 300 + errBackoff); }
}
function setSync(s) { const el = document.getElementById('syncState'); if (el) { el.dataset.s = s; el.textContent = { ok: 'Tersimpan di server', saving: 'Menyimpan…', err: 'Gagal menyimpan, mencoba lagi…' }[s]; } }

}
async function pullState() {
  const r = await api('GET', '/api/state'); const ui = S?.ui;
  let migrated = false;
  if (r.data) { S = r.data; VER = r.version; migrated = migrate(); }
  else { (CFG.demoData ? seed : emptyState)(); VER = 0; }
  S.users = r.users; S.currentUserId = ME.id; S.ui = ui || S.ui || { page: 'dashboard' };
  if (migrated) save();
  if (!r.data) { audit(CFG.demoData ? 'INIT_DEMO_DATA' : 'INIT_EMPTY_DATA', '/api/state', null, null); save(); }
}
async function refreshUsers() { const list = await api('GET', '/api/users'); S.users = list; const me = list.find(u => u.id === ME.id); if (me) ME = me; }

/* ---------- login screen ---------- */
function loginShell(inner) {
  let el = document.getElementById('login'); if (!el) { el = document.createElement('div'); el.id = 'login'; document.body.appendChild(el); }
  el.hidden = false; el.innerHTML = `<div class="lbox"><div class="lbrand"><svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true"><path d="M4 11 16 5l12 6v12l-12 6-12-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M4 11l12 6 12-6M16 17v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 8l12 6" stroke="currentColor" stroke-width="2"/></svg><div><strong>Inventori Multi-Gudang</strong><span>Sistem MVP</span></div></div>${inner}</div>`;
  setTimeout(() => el.querySelector('input')?.focus(), 30); return el;
}
function showLogin(msg) {
  ME = null; clearTimeout(saveTimer); closeModal();
  const el = loginShell(`<form id="loginForm"><h1>Masuk</h1>${msg ? `<p class="lmsg">${esc(msg)}</p>` : ''}
    <label class="fld"><span>Username</span><input name="username" autocomplete="username" required></label>
    <label class="fld"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <p class="lerr" role="alert"></p><button class="btn pri" type="submit">Masuk</button></form>`);
  el.querySelector('form').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target; const b = f.querySelector('button'); b.disabled = true; f.querySelector('.lerr').textContent = '';
    try { const r = await api('POST', '/api/auth/login', { username: f.username.value, password: f.password.value }); ME = r.user; CFG = r.config; await afterLogin(); }
    catch (e) { f.querySelector('.lerr').textContent = e.message; b.disabled = false; }
  };
}
function showChangePw(forced) {
  const el = loginShell(`<form id="pwForm"><h1>${forced ? 'Buat password baru' : 'Ganti password'}</h1><p class="lmsg">${forced ? 'Ini login pertama Anda. Ganti password bawaan sebelum melanjutkan.' : ''} Minimal 8 karakter, memuat huruf besar dan angka.</p>
    <label class="fld"><span>Password saat ini</span><input name="old" type="password" autocomplete="current-password" required></label>
    <label class="fld"><span>Password baru</span><input name="new" type="password" autocomplete="new-password" required minlength="8"></label>
    <label class="fld"><span>Ulangi password baru</span><input name="new2" type="password" autocomplete="new-password" required></label>
    <p class="lerr" role="alert"></p><div class="lacts">${forced ? '' : '<button class="btn" type="button" id="pwCancel">Batal</button>'}<button class="btn pri" type="submit">Simpan password</button></div></form>`);
  if (!forced) el.querySelector('#pwCancel').onclick = () => { el.hidden = true; };
  el.querySelector('form').onsubmit = async ev => {
    ev.preventDefault(); const f = ev.target; const err = f.querySelector('.lerr');
    if (f.new.value !== f.new2.value) { err.textContent = 'Ulangan password baru tidak sama.'; return; }
    try { const r = await api('POST', '/api/auth/password', { old: f.old.value, new: f.new.value }); ME = r.user; toast('Password diganti.'); if (forced) await afterLogin(); else el.hidden = true; }
    catch (e) { err.textContent = e.message; }
  };
}
async function afterLogin() {
  if (ME.mustChangePassword) { showChangePw(true); return; }
  await pullState(); resetForms(); document.getElementById('login').hidden = true; render(); setSync('ok');
}
A.logout = async () => { if (dirty || saving) await flush(); try { await api('POST', '/api/auth/logout'); } catch (e) { } S = null; showLogin('Anda sudah keluar.'); };
A.changePw = () => showChangePw(false);

/* ---------- overrides of prototype UI ---------- */
A.go = d => { if (d.page) S.ui.page = d.page; F.notifOpen = false; document.body.classList.remove('navopen'); closeModal(); render(); window.scrollTo(0, 0); };
const _renderSide = renderSide;
renderSide = function () {
  _renderSide(); const u = cur(); const who = document.querySelector('#side .who');
  if (who) who.innerHTML = `<div class="me"><strong>${esc(u.name)}</strong><span>${esc(ROLES[u.role]?.label || u.role)}${u.warehouseId ? ', ' + esc(W(u.warehouseId)?.name || 'gudang #' + u.warehouseId) : ''}</span></div>
  <small id="syncState" data-s="ok">Tersimpan di server</small><div class="meacts"><button type="button" class="lnk" data-act="changePw">${ic('key')}Ganti password</button><button type="button" class="lnk" data-act="logout">${ic('logout')}Keluar</button></div>`;
};
A.editUser = d => {
  const u = d.id ? U(d.id) : null;
  F.usr = u ? { id: u.id, name: u.name, username: u.username, role: u.role, warehouseId: String(u.warehouseId || ''), password: '' } : { id: null, name: '', username: '', role: 'gudang', warehouseId: '', password: '' };
  openModal({ title: u ? `Ubah ${u.name}` : 'Pengguna baru', body: () => `<div class="formrow">${fld('Nama', `<input data-bind="usr.name" value="${esc(F.usr.name)}" maxlength="80">`, '', 'grow')}${fld('Username', `<input data-bind="usr.username" value="${esc(F.usr.username)}" maxlength="30" ${u ? 'disabled' : ''}>`)}</div>
    <div class="formrow">${fld('Peran', `<select data-bind="usr.role">${Object.entries(ROLES).map(([k, r]) => opt(k, r.label, F.usr.role)).join('')}</select>`)}${fld('Lingkup gudang', whSel('usr.warehouseId', F.usr.warehouseId, actW(), { blank: 'Semua gudang' }))}</div>
    ${fld(u ? 'Reset password (opsional)' : 'Password awal', `<input type="password" autocomplete="new-password" data-bind="usr.password" value="${esc(F.usr.password)}">`, 'Minimal 8 karakter dengan huruf besar dan angka. Pengguna wajib menggantinya saat login berikutnya.')}`,
    foot: () => `<button type="button" class="btn" data-act="closeModal">Batal</button>${btn('Simpan', 'saveUser', {}, { k: 'pri', perm: 'admin' })}` });
};
A.saveUser = async () => {
  const f = F.usr; const body = { name: f.name, role: f.role, warehouseId: f.warehouseId || null };
  if (f.password) body.password = f.password;
  try { need('admin'); if (f.id) await api('PUT', `/api/users/${f.id}`, body); else await api('POST', '/api/users', { ...body, username: f.username }); await refreshUsers(); closeModal(); render(); toast(`${f.name} tersimpan.`); }
  catch (e) { handleErr(e); }
};
const _toggleActive = A.toggleActive;
A.toggleActive = d => {
  if (d.kind !== 'users') return _toggleActive(d);
  const u = U(d.id);
  confirmBox(u.isActive ? 'Nonaktifkan pengguna' : 'Aktifkan pengguna', `<p><strong>${esc(u.name)}</strong> ${u.isActive ? 'tidak bisa login lagi dan sesi aktifnya diputus. Riwayatnya tetap tersimpan.' : 'bisa login kembali.'}</p>`, u.isActive ? 'Nonaktifkan' : 'Aktifkan', async () => {
    try { await api('PUT', `/api/users/${u.id}`, { isActive: !u.isActive }); await refreshUsers(); closeModal(); render(); toast(`${u.name} ${u.isActive ? 'dinonaktifkan' : 'diaktifkan'}.`); } catch (e) { handleErr(e); }
  }, u.isActive ? 'bad' : 'pri');
};
A.resetDemo = () => {
  openModal({ title: 'Atur ulang data', body: () => `<p>Semua transaksi dan master data di server akan diganti. Akun pengguna tidak berubah. Tindakan ini berlaku untuk semua pengguna.</p><div class="alert warn">${ic('alert')}Pastikan Anda sudah mengekspor laporan yang diperlukan.</div>`,
    foot: () => `<button type="button" class="btn" data-act="closeModal">Batal</button><div class="sp"></div>${btn('Mulai dari kosong', 'resetData', { mode: 'empty' }, { k: 'bad', perm: 'admin' })}${btn('Isi data demo', 'resetData', { mode: 'demo' }, { k: 'bad', perm: 'admin' })}` });
};
A.resetData = d => { need('admin'); const users = S.users, ui = S.ui; (d.mode === 'demo' ? seed : emptyState)(); S.users = users; S.currentUserId = ME.id; S.ui = ui; audit(d.mode === 'demo' ? 'RESET_DEMO_DATA' : 'RESET_EMPTY_DATA', '/api/state/reset', null, null); resetForms(); closeModal(); commit(d.mode === 'demo' ? 'Data demo dimuat.' : 'Data dikosongkan. Mulai dari master data.'); };

function init() {
  setInterval(async () => {
    if (!ME || !S) return;
    if (sweep()) { render(); return; }
    if (saving || dirty || M || document.activeElement?.matches('input,select,textarea')) return;
    try { const v = await api('GET', '/api/state/version'); if (v.version !== VER) { await pullState(); render(); } } catch (e) { }
  }, 15000);
  window.addEventListener('beforeunload', e => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });
  (async () => { try { const r = await api('GET', '/api/auth/me'); ME = r.user; CFG = r.config; await afterLogin(); } catch (e) { if (e.status !== 401) showLogin(e.message); else if (!ME) showLogin(); } })();
}

init();

</script>
</body>
</html>
