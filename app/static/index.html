<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventori Multi-Gudang</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#ECF0EE;--surface:#FFFFFF;--surface2:#F5F8F6;--ink:#142322;--muted:#5A6B68;--line:#D3DCD9;--line2:#E4EAE8;
  --side:#10302B;--side-ink:#D5E5E0;--side-muted:#86A9A1;--side-hi:#1C4740;
  --pine:#17735C;--pine-ink:#FFFFFF;--pine-soft:#DCEFE8;
  --amber:#A86C00;--amber-soft:#FBEFD3;--brick:#B23A26;--brick-soft:#F8E1DB;--sky:#2563A6;--sky-soft:#DEE9F6;
  --font:"Schibsted Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1716;--surface:#152120;--surface2:#1A2827;--ink:#E2ECE9;--muted:#95A8A4;--line:#2B3C3A;--line2:#223230;
  --side:#0A1312;--side-ink:#CFE0DB;--side-muted:#7E9C95;--side-hi:#173430;
  --pine:#3FAE8E;--pine-ink:#08201A;--pine-soft:#173B32;--amber:#E2A841;--amber-soft:#3A2D12;--brick:#E8775F;--brick-soft:#3D1F19;--sky:#71A7DE;--sky-soft:#172A3D;}}
:root[data-theme="dark"]{
  --bg:#0E1716;--surface:#152120;--surface2:#1A2827;--ink:#E2ECE9;--muted:#95A8A4;--line:#2B3C3A;--line2:#223230;
  --side:#0A1312;--side-ink:#CFE0DB;--side-muted:#7E9C95;--side-hi:#173430;
  --pine:#3FAE8E;--pine-ink:#08201A;--pine-soft:#173B32;--amber:#E2A841;--amber-soft:#3A2D12;--brick:#E8775F;--brick-soft:#3D1F19;--sky:#71A7DE;--sky-soft:#172A3D;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:var(--pine);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.2}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 240px,transparent 240px)}
.pn{min-width:190px}
.toolbar.filters{margin-top:-4px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px}.toolbar.filters .fld{min-width:140px;flex:1 1 140px}
tr.grp td{background:var(--pine-soft);border-top:1px solid var(--line)}
.tree{padding-left:calc(var(--l) * 22px);position:relative;white-space:nowrap;min-width:230px}.lvl2 .tree::before,.lvl3 .tree::before{content:"";position:absolute;left:calc(var(--l) * 22px - 14px);top:2px;width:8px;height:10px;border-left:1px solid var(--muted);border-bottom:1px solid var(--muted);opacity:.6}
tr.lvl1 td{background:var(--surface2)}tr.lvl1 strong{font-size:15px}
.path{display:flex;flex-wrap:wrap;gap:2px 4px;font-size:13px;min-width:200px}.path span+span::before{content:"› ";color:var(--muted)}.path .lv3{font-weight:600}.tw+.panel,.tw+.note+.panel{margin-top:16px}td.mono{white-space:nowrap}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:20px 18px 16px;color:#fff}
.brand strong{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}.brand span{display:block;font-size:12px;color:var(--side-muted)}
.brand svg{color:#7FD3B8;flex:none}
nav{flex:1;padding:4px 10px 12px}
.ng{margin-top:14px}.ngl{display:block;font-size:12px;color:var(--side-muted);padding:0 10px 4px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:6px;color:var(--side-ink);font-size:14px}
nav a:hover{background:var(--side-hi);text-decoration:none}
nav a[aria-current]{background:#E8F4F0;color:#10302B;font-weight:600}
nav a em{font-style:normal;font-size:11px;font-weight:700;background:#E2A841;color:#2A1C00;border-radius:9px;padding:0 6px;min-width:18px;text-align:center}
.who{padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08)}
.who label{display:block;font-size:12px;color:var(--side-muted);margin-bottom:4px}
.who select{width:100%;background:var(--side-hi);color:#fff;border:1px solid rgba(255,255,255,.15)}
.who small{display:block;color:var(--side-muted);margin-top:6px;font-size:12px}
/* main */
.main{min-width:0;padding:0 28px 48px}
.top{display:flex;align-items:center;gap:12px;padding:20px 0 16px;position:relative}
.tt span{font-size:13px;color:var(--muted)}.tt h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.tr{margin-left:auto;position:relative}
.menu{display:none}
.bell{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink);cursor:pointer}
.bell em{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:11px;font-weight:700;background:var(--brick);color:#fff;border-radius:10px;padding:1px 6px}
.npanel{position:absolute;right:0;top:48px;width:min(380px,86vw);max-height:70vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(10,30,26,.18);z-index:30}
.npanel header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line2);position:sticky;top:0;background:var(--surface)}
.npanel ul{list-style:none;margin:0;padding:0}.npanel li a{display:block;padding:10px 14px 10px 16px;border-bottom:1px solid var(--line2);color:var(--ink);border-left:3px solid var(--line)}
.npanel li.bad a{border-left-color:var(--brick)}.npanel li.warn a{border-left-color:var(--amber)}.npanel li.sky a{border-left-color:var(--sky)}
.npanel b{display:block;font-weight:600;font-size:14px}.npanel span{font-size:13px;color:var(--muted)}
.pad{padding:14px}
/* controls */
input,select,button{font:inherit;color:inherit}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px;width:100%;min-width:0}
input:disabled,select:disabled{opacity:.6}
input.n{text-align:right}input.sm{max-width:110px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 13px;min-height:36px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}.btn.pri:hover{filter:brightness(1.08)}
.btn.bad{background:var(--brick);border-color:var(--brick);color:#fff}.btn.warnb{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.ghost-bad{color:var(--brick)}.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.btn.file{position:relative}
.icon{background:none;border:0;font-size:20px;line-height:1;width:32px;height:32px;border-radius:6px;cursor:pointer;color:var(--muted)}.icon:hover{background:var(--surface2);color:var(--ink)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:150px}.fld>span{font-size:13px;color:var(--muted);font-weight:500}.fld small{font-size:12px;color:var(--muted)}
.fld.grow{flex:1 1 240px}
.chk{display:inline-flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}.chk input{width:auto;min-height:0}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:0 0 14px}
.sp{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:5px;font-size:14px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.formrow{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}.formrow>.fld{flex:1 1 160px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--muted);background:var(--surface2);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:1px solid var(--line);background:var(--surface2)}
.n{text-align:right;white-space:nowrap}
.u{color:var(--muted);font-size:12px}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.mono{font-feature-settings:"tnum","zero";letter-spacing:.01em}
.nodata{text-align:center;color:var(--muted);padding:26px}
table.edit td{padding:6px 6px}table.edit td:first-child{min-width:220px}table.edit input[type=date]{min-width:140px}
table.mini{font-size:13px}table.mini td,table.mini th{padding:6px 10px}
tr.dim td{opacity:.55}tr.hl td{background:var(--amber-soft)}tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}tr.open td{background:var(--pine-soft)}
tr.diffrow td{background:var(--surface2)}table.diff tr.chg td{background:var(--amber-soft)}table.diff td{max-width:420px;word-break:break-all}
td.acts{white-space:nowrap;text-align:right}td.acts .btn{margin-left:4px}
.bad-t{color:var(--brick);font-weight:600}.ok-t{color:var(--pine);font-weight:600}
.yes{color:var(--pine);font-weight:700}.no{color:var(--muted)}
/* chips */
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--pine-soft);color:var(--pine);border-color:transparent}.chip.warn{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.chip.bad{background:var(--brick-soft);color:var(--brick);border-color:transparent}.chip.sky{background:var(--sky-soft);color:var(--sky);border-color:transparent}
.chip.info{background:var(--surface2);color:var(--ink)}
/* expiry bar: the signature element */
.exp{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"d l" "b b";gap:2px 10px;min-width:205px;font-size:13px;white-space:nowrap}
.exp-d{grid-area:d}.exp-l{grid-area:l;text-align:right;color:var(--muted)}
.exp-bar{grid-area:b;position:relative;height:6px;background:var(--line2);border-radius:3px}
.exp-bar i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--pine)}
.exp-bar b{position:absolute;left:33.333%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35}
.exp.warn .exp-bar i{background:var(--amber)}.exp.warn .exp-l{color:var(--amber);font-weight:600}
.exp.bad .exp-bar i{background:repeating-linear-gradient(135deg,var(--brick) 0 5px,transparent 5px 8px)}.exp.bad .exp-l{color:var(--brick);font-weight:700}
/* panels & dashboard */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.panel .tw{border-radius:6px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}.ph h3{font-size:16px;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid2>.panel{margin-bottom:16px}
.grid2.wide-left{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.hello{margin:0 0 16px}.hello h2{font-size:20px;font-weight:600}.hello p{margin:2px 0 0;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;padding:16px 18px 14px;border-left:1px solid var(--line2);display:flex;flex-direction:column;gap:2px;position:relative}
.kpi:first-child{border-left:0}.kpi:hover{background:var(--surface2)}.kpi:focus-visible{outline:2px solid var(--sky);outline-offset:-2px}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--line2)}
.kpi.bad::before{background:var(--brick)}.kpi.warn::before{background:var(--amber)}.kpi.sky::before{background:var(--sky)}
.kv{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1}.kl{font-size:13px;color:var(--muted)}
.ribbon{list-style:none;margin:0;padding:0}.ribbon li{display:grid;grid-template-columns:minmax(0,1fr) minmax(170px,1.1fr);gap:16px;padding:9px 0;border-bottom:1px solid var(--line2);align-items:center}.ribbon li:last-child{border-bottom:0}
.rbn strong{display:block;font-weight:600;font-size:14px}.rbn span{font-size:12px;color:var(--muted)}
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.todo button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:9px 12px;border-radius:6px;border:1px solid var(--line2);border-left:3px solid var(--line)}
.todo button:hover{background:var(--surface2)}.todo button:focus-visible{outline:2px solid var(--sky)}
.todo .warn button{border-left-color:var(--amber)}.todo .bad button{border-left-color:var(--brick)}.todo .sky button{border-left-color:var(--sky)}
.todo b{display:block;font-weight:600;font-size:14px}.todo span{font-size:13px;color:var(--muted)}
.bars{list-style:none;margin:0;padding:0}.bars li{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:8px 0}
.bars i{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--pine) var(--w),var(--line2) var(--w))}.bars b{font-weight:600;font-size:14px}.bars small{color:var(--muted)}
/* misc */
.rule{background:var(--pine-soft);border-left:3px solid var(--pine);padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:14px}
.alert{padding:10px 14px;border-radius:6px;margin:12px 0;font-size:14px;border-left:3px solid}
.alert ul{margin:6px 0 0;padding-left:18px}.alert.sm{padding:6px 10px;margin:6px 0 0;font-size:13px}
.alert.warn{background:var(--amber-soft);border-color:var(--amber)}.alert.bad{background:var(--brick-soft);border-color:var(--brick)}.alert.info{background:var(--sky-soft);border-color:var(--sky)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:80ch}
.formula{font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:6px;padding:8px 12px;margin-bottom:12px;color:var(--muted)}
.trend{color:var(--pine)}.spark{display:block}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px}
.steps ol{margin:0;padding-left:20px}.steps li{margin:4px 0;max-width:80ch}
.plain{margin:6px 0;padding-left:18px;font-size:14px}
.tline{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface2)}
.tlh{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}.tlh .fld{min-width:110px}.tlh .chk{padding-bottom:8px}
.avl{font-size:13px;margin-top:8px}
.picks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px;font-size:13px}.pl{color:var(--muted)}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:2px 8px}.pk small{color:var(--muted)}.pk.strong{font-weight:700}
.arrow{color:var(--muted);font-size:12px}
.meta{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px;margin:0 0 14px}.meta dt{font-size:12px;color:var(--muted)}.meta dd{margin:0;font-size:14px}
.opn-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
/* modal */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.modal[hidden]{display:none}
.mback{position:absolute;inset:0;background:rgba(8,22,19,.5)}
.mbox{position:relative;background:var(--surface);border-radius:12px;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mbox.wide{width:min(980px,100%)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line2)}.mhead h2{font-size:18px}
.mbody{padding:16px 18px;overflow:auto}.mbody>.fld{margin-bottom:12px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line2)}
/* toasts */
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:opacity .3s,transform .3s}
.toast.err{background:var(--brick);color:#fff}.toast.out{opacity:0;transform:translateY(8px)}
/* print document */
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto}
.doc{position:relative;padding:24px;color:#111;font-size:13px;min-width:620px;overflow:hidden}
.doc .wm{position:absolute;inset:0;display:grid;place-items:center;font-size:96px;font-weight:800;color:rgba(178,58,38,.12);transform:rotate(-24deg);pointer-events:none;letter-spacing:.04em}
.doc header{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}
.doc header strong{display:block;font-size:18px}.doc header span{color:#555}.dno{text-align:right;font-weight:700;font-size:16px}.dno span{display:block;font-weight:400;font-size:12px}
.dmeta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.dmeta b{display:block;font-size:11px;color:#555;font-weight:600}
.doc table{font-size:12px}.doc th{background:#f1f1f1;color:#111}.doc td,.doc th{border:1px solid #ccc;padding:5px 7px}.doc tfoot td{background:#f7f7f7}
.sign{display:flex;gap:24px;margin-top:36px}.sign div{flex:1;border-top:1px solid #111;padding-top:4px;text-align:center;margin-top:40px}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block}.doc{min-width:0}}
/* responsive */
@media (max-width:1100px){.grid2,.grid2.wide-left{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line2)}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);background:none}
  .kv{font-size:24px}.kpi{padding:14px}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s;height:100%;padding-top:env(safe-area-inset-top,0px)}
  body.navopen .side{transform:none;box-shadow:0 0 0 100vmax rgba(8,22,19,.45)}
  .menu{display:grid;place-items:center}
  .main{padding:0 14px 40px}.tt h1{font-size:21px}
  .bars li{grid-template-columns:110px 1fr;}.bars b{grid-column:2}
  .ribbon li{grid-template-columns:minmax(0,1fr)}
  .dmeta{grid-template-columns:repeat(2,1fr)}
}

#login{position:fixed;inset:0;z-index:100;background:var(--side);display:grid;place-items:center;padding:20px;overflow:auto}
#login[hidden]{display:none}
.lbox{background:var(--surface);border-radius:12px;padding:28px;width:min(400px,100%);box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lbrand{display:flex;gap:12px;align-items:center;margin-bottom:22px;color:var(--pine)}.lbrand strong{display:block;color:var(--ink);font-size:16px}.lbrand span{font-size:13px;color:var(--muted)}

<body>
<div class="app"><aside class="side" id="side"></aside><main class="main"><header class="top" id="top"></header><div id="view"></div></main></div>
<div id="modal" class="modal" hidden></div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="printArea"></div>
<div id="login" hidden></div>
<script>
'use strict';
/* ================= CORE ================= */
const APP_VERSION = 'v2.2';
const DAY = 864e5, HOUR = 36e5, KEY = 'inventori-mvp-v1';
let S = null;
class UserError extends Error {}
const fail = m => { throw new UserError(m); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r4 = n => Math.round((+n || 0) * 1e4) / 1e4;
const num = (n, d = 2) => (+n || 0).toLocaleString('id-ID', { maximumFractionDigits: d });
const rp = n => 'Rp\u00a0' + Math.round(+n || 0).toLocaleString('id-ID');
const rpShort = n => n >= 1e9 ? 'Rp\u00a0' + num(n / 1e9, 1) + ' M' : n >= 1e6 ? 'Rp\u00a0' + num(n / 1e6, 1) + ' jt' : rp(n);
const fd = t => t ? new Date(t).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '–';
const fdt = t => t ? new Date(t).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '–';
const clone = o => o == null ? null : JSON.parse(JSON.stringify(o));
const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); };
const daysLeft = t => Math.floor((t - today0()) / DAY);
const isoDate = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const parseDate = s => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s).trim()); if (!m) return null; return new Date(+m[1], +m[2] - 1, +m[3]).getTime(); };
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const randToken = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function load() { try { const r = localStorage.getItem(KEY); if (r) { S = JSON.parse(r); return true; } } catch (e) { } return false; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function nid(k) { S.seq[k] = (S.seq[k] || 0) + 1; return S.seq[k]; }
function docNo(p) { const n = nid('doc_' + p); const d = new Date(); return `${p}-${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}-${String(n).padStart(4, '0')}`; }

const byId = (arr, id) => arr.find(x => x.id === +id);
const W = id => byId(S.warehouses, id), P = id => byId(S.products, id), C = id => byId(S.categories, id), SU = id => byId(S.suppliers, id), U = id => byId(S.users, id), BR = id => byId(S.brands, id), TY = id => byId(S.types, id), RK = id => byId(S.racks || [], id);
const KT = id => byId(S.kitchens || [], id), BOM = id => byId(S.boms || [], id), MFG = id => byId(S.productions || [], id);
const actR = wid => (S.racks || []).filter(r => r.isActive && (!wid || r.warehouseId === +wid));
const central = () => S.warehouses.find(w => w.isCentral && w.isActive);
const actW = () => S.warehouses.filter(w => w.isActive);
const actP = () => S.products.filter(p => p.isActive);
const actKT = () => (S.kitchens || []).filter(k => k.isActive);
const actBOM = () => (S.boms || []).filter(b => b.isActive);
const cur = () => U(S.currentUserId) || S.users[0];
const uoms = p => [{ name: p.baseUom, factor: 1 }, ...(p.uoms || [])];
const uomF = (p, name) => (uoms(p).find(u => u.name === name) || { factor: 1 }).factor;
/* kategori 3 level: Grup (1) > Kategori (2) > Subkategori (3); produk hanya di level 3 */
const LEVEL_NAME = { 1: 'Grup', 2: 'Kategori', 3: 'Subkategori' };
function catChain(id) { const out = []; let c = C(id), g = 0; while (c && g++ < 5) { out.unshift(c); c = c.parentId ? C(c.parentId) : null; } return out; }
const catPath = (id, sep = ' › ') => catChain(id).map(c => c.name).join(sep);
const catAt = (id, lvl) => catChain(id).find(c => c.level === lvl);
function catInherit(id, key) { const ch = catChain(id); for (let i = ch.length - 1; i >= 0; i--) if (ch[i][key] != null && ch[i][key] !== '') return { v: +ch[i][key], from: ch[i] }; return null; }
const leafCats = () => S.categories.filter(c => c.level === 3 && catChain(c.id).every(x => x.isActive)).sort((a, b) => catPath(a.id).localeCompare(catPath(b.id)));
const ttlOf = p => (p.overrideTtl != null && p.overrideTtl !== '') ? +p.overrideTtl : (catInherit(p.categoryId, 'ttlHours')?.v ?? 24);
const thrOf = p => catInherit(p.categoryId, 'expiryDays')?.v ?? S.settings.expiryDays;
const minOf = (p, w) => +(w.isCentral ? p.minCentral : p.minBranch) || 0;

/* ================= ROLES ================= */
const ROLES = {
  admin: { label: 'Admin', perms: ['*'] },
  gudang: { label: 'Staf Gudang', perms: ['inbound', 'transfer', 'usage', 'scrap.create', 'opname.count', 'relocate', 'mfg.plan', 'mfg.exec'] },
  purchasing: { label: 'Purchasing', perms: ['po', 'supplier', 'report', 'mfg.plan'] },
  approver: { label: 'Approver', perms: ['scrap.approve', 'opname.post', 'report', 'audit', 'mfg.plan', 'mfg.exec'] },
};
const PERM_LABEL = { inbound: 'penerimaan barang', transfer: 'transfer', usage: 'pemakaian', 'scrap.create': 'pengajuan scrap', 'scrap.approve': 'approval scrap', 'opname.count': 'hitung stock opname', 'opname.post': 'posting stock opname', po: 'purchase order', supplier: 'master supplier', report: 'laporan', audit: 'audit log', master: 'master data', admin: 'administrasi', relocate: 'pindah rak', 'mfg.plan': 'jadwal manufaktur', 'mfg.exec': 'eksekusi produksi', bom: 'master resep (BOM)', kitchen: 'master dapur' };
function can(p) { const r = ROLES[cur().role]; return !!r && (r.perms.includes('*') || r.perms.includes(p)); }
function need(p) { if (!can(p)) fail(`Peran ${ROLES[cur().role].label} tidak punya akses ${PERM_LABEL[p] || p}.`); }
const myWhIds = () => { const u = cur(); return u.warehouseId ? [u.warehouseId] : actW().map(w => w.id); };

/* ================= AUDIT (JSON Lines) ================= */
function audit(action, endpoint, before, after, sysUser) {
  S.audit.unshift({
    timestamp: new Date().toISOString(), user_id: sysUser || cur().username, role: sysUser ? 'system' : cur().role,
    action, endpoint, payload_before: before == null ? null : clone(before), payload_after: after == null ? null : clone(after)
  });
  if (S.audit.length > 3000) S.audit.length = 3000;
}

/* ================= STOCK HELPERS ================= */
const resQty = bid => S.reservations.filter(r => r.batchId === bid).reduce((a, r) => a + r.qty, 0);
const avail = b => Math.max(0, r4(b.qty - resQty(b.id)));
const fifoSort = (a, b) => a.inboundAt - b.inboundAt || a.id - b.id;
const batchesOf = (pid, wid) => S.batches.filter(b => b.productId === +pid && b.warehouseId === +wid && b.qty > 1e-9).sort(fifoSort);
const stockQ = (pid, wid) => S.batches.filter(b => b.productId === +pid && (wid == null || b.warehouseId === +wid)).reduce((a, b) => a + b.qty, 0);
const availQ = (pid, wid) => batchesOf(pid, wid).reduce((a, b) => a + avail(b), 0);
function fifoPlan(pid, wid, qty) {
  let rem = r4(qty); const picks = [];
  for (const b of batchesOf(pid, wid)) { const a = avail(b); if (a <= 1e-9) continue; const q = Math.min(a, rem); picks.push({ batchId: b.id, qty: r4(q) }); rem = r4(rem - q); if (rem <= 1e-9) break; }
  return { picks, short: rem > 1e-9 ? rem : 0 };
}
function fifoViolation(pid, wid, picks) {
  const m = new Map(picks.map(p => [p.batchId, p.qty])); let gap = false;
  for (const b of batchesOf(pid, wid)) { const t = m.get(b.id) || 0; const a = avail(b); if (t > 0 && gap) return true; if (t < a - 1e-9) gap = true; }
  return false;
}
function mv(type, b, qty, ref, note) {
  S.movements.push({ id: nid('mv'), ts: Date.now(), type, productId: b.productId, warehouseId: b.warehouseId, batchId: b.id, batchNo: b.batchNo, qty: r4(qty), cost: b.cost, ref: ref || '', note: note || '', user: cur().username });
}
function deduct(picks, type, ref, note) {
  let cogs = 0; const out = [];
  for (const p of picks) {
    const b = byId(S.batches, p.batchId); b.qty = r4(b.qty - p.qty); cogs += p.qty * b.cost; mv(type, b, -p.qty, ref, note);
    out.push({ batchId: b.id, batchNo: b.batchNo, qty: p.qty, cost: b.cost, expDate: b.expDate, inboundAt: b.inboundAt, rack: b.rack });
  }
  return { cogs: r4(cogs), out };
}
function relocateBatch(d) {
  if (!can('inbound') && !can('transfer') && !can('relocate') && !can('master')) fail('Tidak punya akses pindah rak.');
  const b = byId(S.batches, d.batchId);
  if (!b) fail('Batch tidak ditemukan.');
  if (!myWhIds().includes(b.warehouseId)) fail('Hanya bisa memindahkan barang di gudang tugas Anda.');
  const fromRack = (b.rack || '').trim();
  const toRack = String(d.targetRack || '').trim().toUpperCase();
  if (!toRack) fail('Pilih rak tujuan.');
  if (fromRack.toUpperCase() === toRack) fail('Rak tujuan harus berbeda dari rak saat ini.');
  const rkObj = (S.racks || []).find(r => r.warehouseId === b.warehouseId && r.code.toUpperCase() === toRack && r.isActive);
  if (!rkObj) fail(`Rak ${toRack} tidak terdaftar atau tidak aktif di ${W(b.warehouseId).name}.`);
  const q = r4(d.qty);
  if (!(q > 0)) fail('Jumlah pindah rak harus lebih dari 0.');
  const a = avail(b);
  if (q > a + 1e-9) fail(`Jumlah melebihi stok yang tersedia (${num(a)} ${P(b.productId).baseUom}).`);

  const p = P(b.productId);
  const before = clone(b);
  const note = String(d.note || '').trim();
  let msg = '';

  if (Math.abs(q - b.qty) <= 1e-9) {
    b.rack = toRack;
    mv('RELOCATE', b, 0, b.batchNo, `Pindah rak dari ${fromRack || 'Tanpa rak'} ke ${toRack}${note ? ' (' + note + ')' : ''}`);
    audit('RELOCATE_RACK', `/api/v1/batches/${b.id}/relocate`, before, b);
    msg = `${p.name} (Batch ${b.batchNo}) dipindahkan ke rak ${toRack}.`;
  } else {
    b.qty = r4(b.qty - q);
    let dst = S.batches.find(x => x.warehouseId === b.warehouseId && x.productId === b.productId && x.batchNo === b.batchNo && x.expDate === b.expDate && x.cost === b.cost && (x.rack || '').toUpperCase() === toRack);
    if (dst) {
      dst.qty = r4(dst.qty + q);
    } else {
      dst = { id: nid('batches'), productId: b.productId, warehouseId: b.warehouseId, batchNo: b.batchNo, expDate: b.expDate, qty: q, cost: b.cost, rack: toRack, inboundAt: b.inboundAt, createdAt: Date.now() };
      S.batches.push(dst);
    }
    mv('RELOCATE', dst, 0, b.batchNo, `Pindah ${num(q)} ${p.baseUom} dari ${fromRack || 'Tanpa rak'} ke ${toRack}${note ? ' (' + note + ')' : ''}`);

/* ================= TRANSFER ================= */
function createTransfer(d) {
  need('transfer');
  const src = W(d.srcId), dst = W(d.dstId);
  if (!src || !src.isActive) fail('Pilih gudang asal yang aktif.');
  if (!dst || !dst.isActive) fail('Pilih gudang tujuan yang aktif.');
  if (src.id === dst.id) fail('Gudang asal dan tujuan tidak boleh sama.');
  if (!myWhIds().includes(src.id)) fail('Anda hanya bisa membuat transfer dari gudang tugas Anda.');
  const lines = d.lines.filter(l => l.productId);
  if (!lines.length) fail('Tambahkan minimal satu barang.');
  const seen = new Set(); let ttl = Infinity, override = false; const out = [];
  for (const l of lines) {
    const p = P(l.productId); if (!p || !p.isActive) fail('Produk tidak aktif.');
    if (seen.has(p.id)) fail(`${p.name} tercantum dua kali. Gabungkan dalam satu baris.`); seen.add(p.id);
    const q = r4(l.qty); if (!(q > 0)) fail(`Jumlah ${p.name} harus lebih dari 0.`);
    let picks;
    if (l.manual) {
      picks = Object.entries(l.picks || {}).map(([bid, v]) => ({ batchId: +bid, qty: r4(v) })).filter(x => x.qty > 0);
      const sum = r4(picks.reduce((a, x) => a + x.qty, 0));
      if (Math.abs(sum - q) > 1e-6) fail(`Total pilihan batch ${p.name} (${num(sum)}) harus sama dengan jumlah transfer (${num(q)} ${p.baseUom}).`);
      for (const pk of picks) { const b = byId(S.batches, pk.batchId); if (!b || b.warehouseId !== src.id || b.productId !== p.id) fail('Batch tidak valid.'); if (pk.qty > avail(b) + 1e-9) fail(`Batch ${b.batchNo} hanya tersedia ${num(avail(b))} ${p.baseUom}.`); }
      if (fifoViolation(p.id, src.id, picks)) override = true;
    } else {
      const plan = fifoPlan(p.id, src.id, q);
      if (plan.short > 0) fail(`Stok ${p.name} di ${src.name} tidak cukup: tersedia ${num(q - plan.short)} ${p.baseUom}, diminta ${num(q)}. Transfer tidak mengenal backorder, kurangi jumlahnya.`);
      picks = plan.picks;
    }
    ttl = Math.min(ttl, ttlOf(p));

function receiveTransfer(id, rec, targetRacks) {

      mv('TRF_IN', b, r, t.no, (r > pk.qty ? `Termasuk surplus ${num(r - pk.qty)}. ` : '') + (destRack ? `Masuk rak ${destRack}` : ''));
    }

  }));

  });

  };

  return b;
}

function calculateBomRequirements(bom, qty, sourceWarehouseId) {
  const mult = (+qty || 0) / (bom.yieldQty || 1);
  const wid = +sourceWarehouseId;
  const items = [];
  let allAvailable = true;
  let totalEstCost = 0;

  for (const line of bom.lines) {
    const p = P(line.productId);
    if (!p) continue;
    const reqQty = r4(line.qty * mult);
    const reqBase = r4(reqQty * uomF(p, line.uom));
    const av = availQ(p.id, wid);
    const plan = fifoPlan(p.id, wid, reqBase);
    let estCost = 0;
    for (const pk of plan.picks) {
      const b = byId(S.batches, pk.batchId);
      if (b) estCost += pk.qty * b.cost;
    }
    if (plan.picks.length === 0 && reqBase > 0) {
      estCost = reqBase * (p.refPrice || 0);
    }
    totalEstCost += estCost;
    const isShort = plan.short > 1e-9;
    if (isShort) allAvailable = false;
    items.push({
      productId: p.id,
      product: p,
      uom: line.uom,
      lineQty: line.qty,
      reqQty,
      reqBase,
      availableBase: av,
      shortBase: plan.short,
      estCost,
      picks: plan.picks
    });
  }
  return { items, allAvailable, totalEstCost: r4(totalEstCost) };
}

function createProductionPlan(d) {

function completeProduction(d) {
  need('mfg.exec');
  const prod = MFG(d.id);
  if (!prod) fail('Data produksi tidak ditemukan.');
  if (['selesai', 'batal'].includes(prod.status)) fail('Produksi ini sudah selesai atau dibatalkan.');

  const bom = BOM(prod.bomId);
  if (!bom) fail('Resep (BOM) tidak ditemukan.');
  const finishedP = P(prod.productId);
  if (!finishedP) fail('Produk jadi tidak ditemukan.');
  const kitchen = KT(prod.kitchenId);

  const actualQty = r4(+d.actualQty);
  if (!(actualQty > 0)) fail('Jumlah aktual hasil produksi harus lebih dari 0.');

  const batchNo = String(d.batchNo || '').trim().toUpperCase();
  if (!batchNo) fail('Nomor batch hasil produksi wajib diisi.');
  if (batchNo.length > 50) fail('Nomor batch maksimal 50 karakter.');

  const expDate = parseDate(d.expDate);
  if (!expDate) fail('Tanggal kedaluwarsa hasil produksi wajib diisi.');
  if (daysLeft(expDate) <= 0) fail('Tanggal kedaluwarsa tidak boleh hari ini atau tanggal yang sudah lewat.');

  const targetWid = d.targetWarehouseId ? +d.targetWarehouseId : prod.targetWarehouseId;
  const targetW = W(targetWid);
  if (!targetW || !targetW.isActive) fail('Pilih gudang tujuan hasil produksi yang aktif.');

  const targetRack = String(d.targetRack || prod.targetRack || '').trim().toUpperCase();
  if (targetRack) {
    const rkObj = (S.racks || []).find(r => r.warehouseId === targetWid && r.code.toUpperCase() === targetRack && r.isActive);
    if (!rkObj) fail(`Rak ${targetRack} tidak terdaftar atau tidak aktif di ${targetW.name}.`);
  }

  const reqCheck = calculateBomRequirements(bom, actualQty, prod.sourceWarehouseId);
  if (!reqCheck.allAvailable) {
    const shortItems = reqCheck.items.filter(x => x.shortBase > 1e-9);
    const shortNames = shortItems.map(x => `${x.product.name} (kurang ${num(x.shortBase)} ${x.product.baseUom})`).join(', ');
    fail(`Stok bahan baku di ${W(prod.sourceWarehouseId).name} tidak mencukupi untuk memproduksi ${num(actualQty)} ${bom.yieldUom}: ${shortNames}.`);
  }

  const before = clone(prod);
  let totalCogs = 0;
  const ingredientsUsed = [];

  for (const item of reqCheck.items) {
    const { cogs, out } = deduct(item.picks, 'PROD_USAGE', prod.no, `Produksi ${prod.no}: ${finishedP.name}`);
    totalCogs += cogs;
    ingredientsUsed.push({
      productId: item.productId,
      name: item.product.name,
      qtyUsed: item.reqBase,
      uom: item.product.baseUom,
      cogs,
      picks: out
    });
  }

  totalCogs = r4(totalCogs);
  const outputBaseQty = r4(actualQty * uomF(finishedP, bom.yieldUom));
  const unitCostBase = outputBaseQty > 0 ? r4(totalCogs / outputBaseQty) : 0;

  let dstBatch = S.batches.find(x => x.warehouseId === targetWid && x.productId === finishedP.id && x.batchNo === batchNo && x.expDate === expDate && x.cost === unitCostBase && (x.rack || '').toUpperCase() === targetRack);
  if (dstBatch) {
    dstBatch.qty = r4(dstBatch.qty + outputBaseQty);
  } else {
    dstBatch = {
      id: nid('batches'),
      productId: finishedP.id,
      warehouseId: targetWid,
      batchNo,
      expDate,
      qty: outputBaseQty,
      cost: unitCostBase,
      rack: targetRack,
      inboundAt: Date.now(),
      createdAt: Date.now()
    };
    S.batches.push(dstBatch);
  }

  mv('PROD_OUTPUT', dstBatch, outputBaseQty, prod.no, `Hasil produksi dari ${kitchen ? kitchen.name : 'Dapur'} (${num(actualQty)} ${bom.yieldUom})`);

  Object.assign(prod, {
    status: 'selesai',
    actualQty,
    targetWarehouseId: targetWid,
    targetRack,
    batchNo,
    expDate,
    cogs: totalCogs,
    unitCost: unitCostBase,
    ingredientsUsed,
    completedAt: Date.now(),
    completedBy: cur().username,
    completionNote: String(d.completionNote || '').trim()
  });

  audit('COMPLETE_PRODUCTION', `/api/v1/productions/${prod.no}/complete`, before, prod);
  return { prod, batch: dstBatch };
}

function recordUsage({ warehouseId, productId, uom, uomQty, note }) {

/* ================= INBOUND ================= */
function inboundCheck(d) {
  const errors = [], warnings = []; const c = central();
  if (!c) errors.push('Belum ada Gudang Central aktif. Penerimaan wajib melalui Gudang Central.');
  else if (!myWhIds().includes(c.id)) errors.push('Penerimaan barang hanya dilakukan staf Gudang Central.');
  if (!d.supplierId || !SU(d.supplierId)?.isActive) errors.push('Pilih supplier.');
  if (d.poId) { const po = byId(S.pos, d.poId); if (!po || po.status !== 'dipesan') errors.push('PO tidak dalam status dipesan.'); else if (po.supplierId !== +d.supplierId) errors.push('Supplier tidak sesuai dengan PO.'); }
  const lines = d.lines.filter(l => l.productId);
  if (!lines.length) errors.push('Tambahkan minimal satu barang.');
  const keys = new Set();
  lines.forEach((l, i) => {
    const p = P(l.productId); const n = `Baris ${i + 1} (${p.name})`; const f = uomF(p, l.uom); const qty = +l.qty, cost = +l.cost;
    if (!(qty > 0)) errors.push(`${n}: jumlah harus lebih dari 0.`);
    if (l.cost === '' || isNaN(cost) || cost < 0) errors.push(`${n}: harga beli wajib diisi.`);
    const bn = String(l.batchNo || '').trim();
    if (!bn) errors.push(`${n}: nomor batch wajib diisi.`); else if (bn.length > 100) errors.push(`${n}: nomor batch maksimal 100 karakter.`);
    if (keys.has(p.id + '|' + bn)) errors.push(`${n}: batch ${bn} tercantum dua kali.`); keys.add(p.id + '|' + bn);
    const exp = parseDate(l.exp);
    if (!exp) errors.push(`${n}: tanggal kedaluwarsa wajib diisi.`);
    else if (c) {
      const dl = daysLeft(exp);
      if (dl < 0) errors.push(`${n}: barang sudah kedaluwarsa dan tidak boleh diterima.`);

  const o = get(id); const before = clone(o);
  if (o.isActive) {
    if (kind === 'products' && stockQ(o.id) > 1e-9) fail(`${o.name} masih punya stok ${num(stockQ(o.id))} ${o.baseUom}. Habiskan atau scrap dulu sebelum dinonaktifkan.`);
    if (kind === 'warehouses' && S.batches.some(b => b.warehouseId === o.id && b.qty > 1e-9)) fail(`${o.name} masih menyimpan stok. Pindahkan dulu sebelum dinonaktifkan.`);
    if (kind === 'warehouses' && S.transfers.some(t => ['draft', 'dikirim'].includes(t.status) && (t.srcId === o.id || t.dstId === o.id))) fail('Masih ada transfer berjalan untuk gudang ini.');
    if (kind === 'racks' && S.batches.some(b => b.warehouseId === o.warehouseId && (b.rack || '').toUpperCase() === o.code.toUpperCase() && b.qty > 1e-9)) fail(`Rak ${o.code} masih menyimpan stok barang.`);
    if (kind === 'kitchens' && (S.productions || []).some(p => p.kitchenId === o.id && ['terjadwal', 'diproses'].includes(p.status))) fail(`Dapur ${o.name} masih memiliki jadwal produksi aktif.`);
    if (kind === 'boms' && (S.productions || []).some(p => p.bomId === o.id && ['terjadwal', 'diproses'].includes(p.status))) fail(`Resep ${o.name} masih dipakai pada jadwal produksi aktif.`);
    if (kind === 'categories' && S.categories.some(c => c.isActive && c.parentId === o.id)) fail(`Masih ada turunan aktif di bawah ${o.name}. Nonaktifkan turunannya dulu.`);
    if (kind === 'categories' && S.products.some(p => p.isActive && p.categoryId === o.id)) fail('Subkategori masih dipakai produk aktif.');
    if (kind === 'brands' && S.products.some(p => p.isActive && p.brandId === o.id)) fail('Merek masih dipakai produk aktif.');
    if (kind === 'types' && S.products.some(p => p.isActive && p.typeId === o.id)) fail('Jenis masih dipakai produk aktif.');
    if (kind === 'suppliers' && S.pos.some(p => p.supplierId === o.id && ['draft', 'dipesan'].includes(p.status))) fail('Supplier masih punya PO berjalan.');
    if (kind === 'users' && o.id === cur().id) fail('Anda tidak bisa menonaktifkan akun yang sedang dipakai.');
  } else if (kind === 'warehouses' && o.isCentral && S.warehouses.some(w => w.isCentral && w.isActive)) fail('Sudah ada Gudang Central aktif lain.');
  else if (kind === 'categories' && o.parentId && !C(o.parentId).isActive) fail('Aktifkan induknya dulu.');
  o.isActive = !o.isActive;
  audit((o.isActive ? 'ACTIVATE_' : 'SOFT_DELETE_') + label, `/api/v1/${kind}/${o.id}`, before, o);
}

      const cKer = (S.categories || []).find(c => c.name.toLowerCase() === 'tepung') || (S.categories || []).find(c => c.level === 3);
      p11 = { id: nid('products'), code: 'P-011', name: 'Roti Tawar Gandum', categoryId: cKer?.id || S.categories?.[0]?.id || 1, typeId: S.types?.[1]?.id || S.types?.[0]?.id || 2, brandId: null, baseUom: 'loaf', uoms: [{ name: 'pack', factor: 1 }, { name: 'dus', factor: 10 }], poUom: 'dus', minCentral: 30, minBranch: 10, refPrice: 18000, supplierId: null, overrideTtl: 5 * 24, isActive: true };
      S.products.push(p11);

    let p12 = S.products.find(p => p.code === 'P-012');
    if (!p12) {
      const cPro = (S.categories || []).find(c => c.name.toLowerCase().includes('daging')) || (S.categories || []).find(c => c.level === 3);
      p12 = { id: nid('products'), code: 'P-012', name: 'Patty Daging Burger', categoryId: cPro?.id || S.categories?.[0]?.id || 1, typeId: S.types?.[1]?.id || S.types?.[0]?.id || 2, brandId: null, baseUom: 'pcs', uoms: [{ name: 'pack', factor: 10 }, { name: 'box', factor: 50 }], poUom: 'box', minCentral: 50, minBranch: 15, refPrice: 12000, supplierId: null, overrideTtl: 14 * 24, isActive: true };
      S.products.push(p12);
    }
    if (!S.boms.some(b => b.code === 'BOM-BKR-01')) {
      const k1 = S.kitchens.find(k => k.code === 'DPR-BKR');
      const pTepung = S.products.find(p => p.code === 'P-001') || S.products[0];
      const pGula = S.products.find(p => p.code === 'P-002') || S.products[0];
      const pSusu = S.products.find(p => p.code === 'P-003') || S.products[0];
      const pMtg = S.products.find(p => p.code === 'P-004') || S.products[0];
      if (pTepung && pGula && pSusu && pMtg) {
        S.boms.push({
          id: nid('boms'), code: 'BOM-BKR-01', name: 'Resep Roti Tawar Gandum (10 Loaf)', productId: p11.id, kitchenId: k1 ? k1.id : null,
          yieldQty: 10, yieldUom: 'loaf',
          lines: [
            { productId: pTepung.id, qty: 4, uom: pTepung.baseUom },
            { productId: pGula.id, qty: 0.5, uom: pGula.baseUom },
            { productId: pSusu.id, qty: 1, uom: pSusu.baseUom },
            { productId: pMtg.id, qty: 0.4, uom: pMtg.baseUom }
          ],
          instructions: 'Campur adonan, uleni hingga kalis, diamkan 45 menit, panggang 180C selama 30 menit.', isActive: true
        });
      }
    }
    if (!S.boms.some(b => b.code === 'BOM-HOT-01')) {
      const k2 = S.kitchens.find(k => k.code === 'DPR-HOT');
      const pDaging = S.products.find(p => p.code === 'P-007') || S.products[0];
      const pGula = S.products.find(p => p.code === 'P-002') || S.products[0];
      const pSaus = S.products.find(p => p.code === 'P-008') || S.products[0];
      if (pDaging && pGula && pSaus) {
        S.boms.push({
          id: nid('boms'), code: 'BOM-HOT-01', name: 'Resep Patty Daging Burger (20 Pcs)', productId: p12.id, kitchenId: k2 ? k2.id : null,
          yieldQty: 20, yieldUom: 'pcs',
          lines: [

            { productId: pGula.id, qty: 0.1, uom: pGula.baseUom },
            { productId: pSaus.id, qty: 1, uom: pSaus.baseUom }
          ],
          instructions: 'Bumbui daging cincang, aduk merata, cetak per 120gr, bekukan di blast freezer.', isActive: true
        });
      }
    }
    ch = true;
  }
  if (!S.racks) {
    S.racks = [];
    const seen = new Set();
    (S.batches || []).forEach(b => {
      const rk = String(b.rack || '').trim().toUpperCase();
      if (rk && b.warehouseId) {
        const k = `${b.warehouseId}|${rk}`;
        if (!seen.has(k)) {
          seen.add(k);
          S.racks.push({ id: nid('racks'), warehouseId: b.warehouseId, code: rk, name: `Rak ${rk}`, isActive: true });
        }
      }
    });
    ch = true;
  }
  if (S.v < 2) {
    S.brands = S.brands || []; S.types = S.types || [];
    if (!S.types.length) ['Bahan baku', 'Barang jadi', 'Kemasan', 'Consumable'].forEach(name => S.types.push({ id: nid('types'), name, isActive: true }));
    const old = S.categories;
    const l1 = { id: nid('categories'), name: 'Belum dikelompokkan', parentId: null, level: 1, ttlHours: 24, expiryDays: S.settings.expiryDays, isActive: true };
    const l2 = { id: nid('categories'), name: 'Belum dikelompokkan', parentId: l1.id, level: 2, ttlHours: null, expiryDays: null, isActive: true };
    old.forEach(c => { c.parentId = l2.id; c.level = 3; });
    S.categories = [l1, l2, ...old];
    S.products.forEach(p => { if (p.typeId == null) p.typeId = S.types[0].id; if (p.brandId === undefined) p.brandId = null; });
    S.v = 2;
    audit('MIGRATE_V2_CATEGORY_HIERARCHY', '/api/v1/migrate', null, { note: 'Kategori lama dipindah menjadi subkategori di bawah "Belum dikelompokkan". Semua produk diberi jenis Bahan baku.' }, 'system');
    ch = true;
  }
  return ch;
}

V.stock = () => {
  const f = F.stk; const ws = actW().filter(w => !f.wid || w.id === +f.wid); const q = (f.q || '').toLowerCase();
  const ps = actP().filter(p => prodMatch(p, f) && (!q || (p.name + ' ' + p.code + ' ' + (BR(p.brandId)?.name || '')).toLowerCase().includes(q)));
  let body;
  if (f.mode === 'sum') {
    const items = [];
    for (const w of ws) for (const p of ps) {
      let bs = S.batches.filter(b => b.productId === p.id && b.warehouseId === w.id && b.qty > 1e-9);
      if (f.rack) bs = bs.filter(b => (b.rack || '').toUpperCase() === f.rack.toUpperCase());
      const m = minOf(p, w);
      if (!bs.length && !(m > 0 && !f.rack)) continue;
      items.push({ p, w, m, qty: bs.reduce((a, b) => a + b.qty, 0), res: bs.reduce((a, b) => a + resQty(b.id), 0), v: bs.reduce((a, b) => a + b.qty * b.cost, 0), near: bs.slice().sort((a, b) => a.expDate - b.expDate)[0], g: f.group ? groupOf(f.group, p, w) : '' });
    }
    if (f.group) items.sort((a, b) => a.g.localeCompare(b.g));
    const rows = []; let lastG = null; const tot = items.reduce((a, x) => a + x.v, 0);
    for (const x of items) {
      if (f.group && x.g !== lastG) { lastG = x.g; const gi = items.filter(y => y.g === x.g); const gv = gi.reduce((a, y) => a + y.v, 0); rows.push(`<tr class="grp"><td colspan="6"><strong>${esc(x.g)}</strong> <span class="muted">${gi.length} posisi stok, ${new Set(gi.map(y => y.p.id)).size} produk${gi.some(y => y.qty < y.m) ? `, ${gi.filter(y => y.qty < y.m).length} di bawah minimum` : ''}</span></td><td class="n">${rp(gv)}</td><td colspan="2" class="muted">${tot ? (gv / tot * 100).toFixed(1) + '% dari total' : ''}</td></tr>`); }
      const { p, w, m, qty, res, v, near } = x;
      rows.push(`<tr><td>${pname(p)}</td><td>${esc(w.name)}</td><td class="n${qty < m ? ' bad-t' : ''}">${qtyU(qty, p)}</td><td class="n">${res ? num(res) : '–'}</td><td class="n">${num(qty - res)}</td><td class="n">${num(m)}</td><td class="n">${rp(v)}</td><td>${near ? expCell(near.expDate, p) : '–'}</td><td>${qty < m ? chip('Di bawah minimum', 'bad') : chip('Cukup', 'ok')}</td></tr>`);
    }
    body = tbl(['Produk', 'Gudang', ['Stok', 'n'], ['Reservasi', 'n'], ['Tersedia', 'n'], ['Minimum', 'n'], ['Nilai', 'n'], 'Kedaluwarsa terdekat', 'Status'], rows, { empty: 'Tidak ada stok yang cocok dengan filter.', foot: items.length ? `<tfoot><tr><td colspan="6">Total ${items.length} posisi stok</td><td class="n">${rp(tot)}</td><td colspan="2"></td></tr></tfoot>` : '' });
  } else if (f.mode === 'batch') {
    let bs = S.batches.filter(b => b.qty > 1e-9 && ws.some(w => w.id === b.warehouseId) && ps.some(p => p.id === b.productId));
    if (f.rack) bs = bs.filter(b => (b.rack || '').toUpperCase() === f.rack.toUpperCase());
    bs.sort((a, b) => a.warehouseId - b.warehouseId || a.productId - b.productId || fifoSort(a, b));
    const canMove = can('transfer') || can('inbound') || can('relocate');
    body = tbl(['Produk', 'Gudang', 'Batch', 'Rak', 'Masuk', 'Kedaluwarsa', ['Qty', 'n'], ['Reservasi', 'n'], ['HPP/satuan', 'n'], ['Nilai', 'n'], 'Aksi'],
      bs.map(b => {
        const p = P(b.productId); const r = resQty(b.id);
        return `<tr><td>${pname(p)}</td><td>${esc(W(b.warehouseId).name)}</td><td class="mono">${esc(b.batchNo)}</td><td><strong>${esc(b.rack || '–')}</strong></td><td>${fd(b.inboundAt)}</td><td>${expCell(b.expDate, p)}</td><td class="n">${qtyU(b.qty, p)}</td><td class="n">${r ? num(r) : '–'}</td><td class="n">${rp(b.cost)}</td><td class="n">${rp(b.qty * b.cost)}</td><td class="acts">${canMove ? btn('Pindah rak', 'openRelocate', { batchId: b.id }, { k: 'sm', perm: 'transfer' }) : ''}</td></tr>`;
      }), { empty: 'Tidak ada batch yang cocok dengan filter.' });
  } else {
    const rows = []; let grandTotalVal = 0;
    const canMove = can('transfer') || can('inbound') || can('relocate');
    for (const w of ws) {
      const wRacks = (S.racks || []).filter(r => r.warehouseId === w.id && r.isActive);
      const existingRkCodes = new Set(wRacks.map(r => r.code.toUpperCase()));
      const extraBatches = S.batches.filter(b => b.warehouseId === w.id && b.qty > 1e-9 && !existingRkCodes.has((b.rack || '').toUpperCase()));
      const extraRkCodes = [...new Set(extraBatches.map(b => (b.rack || '').trim().toUpperCase()))];
      const allRks = [
        ...wRacks.map(r => ({ code: r.code, name: r.name })),
        ...extraRkCodes.map(code => ({ code, name: code ? 'Rak belum terdaftar' : 'Belum ditempatkan (Tanpa rak)' }))
      ].sort((a, b) => a.code.localeCompare(b.code));

      for (const rk of allRks) {
        if (f.rack && rk.code.toUpperCase() !== f.rack.toUpperCase()) continue;
        const bs = S.batches.filter(b => b.warehouseId === w.id && (b.rack || '').toUpperCase() === rk.code.toUpperCase() && b.qty > 1e-9 && ps.some(p => p.id === b.productId));
        const rkVal = bs.reduce((a, b) => a + b.qty * b.cost, 0);
        grandTotalVal += rkVal;
        rows.push(`<tr class="grp"><td colspan="7"><strong>${esc(w.name)} › Rak ${esc(rk.code || 'Tanpa Rak')}</strong>${rk.name ? ` <span class="muted">(${esc(rk.name)})</span>` : ''} <span class="muted">– ${bs.length} batch (${new Set(bs.map(b => b.productId)).size} produk)</span></td><td class="n"><strong>${rp(rkVal)}</strong></td><td></td></tr>`);
        if (!bs.length) {
          rows.push(`<tr><td colspan="9" class="muted" style="padding-left:28px;">Rak ini kosong.</td></tr>`);
        } else {
          for (const b of bs) {
            const p = P(b.productId); const r = resQty(b.id);
            rows.push(`<tr><td style="padding-left:28px;">${pname(p)}</td><td>${esc(w.name)}</td><td class="mono">${esc(b.batchNo)}</td><td><strong>${esc(rk.code || '–')}</strong></td><td>${fd(b.inboundAt)}</td><td>${expCell(b.expDate, p)}</td><td class="n">${qtyU(b.qty, p)}</td><td class="n">${rp(b.qty * b.cost)}</td><td class="acts">${canMove ? btn('Pindah rak', 'openRelocate', { batchId: b.id }, { k: 'sm', perm: 'transfer' }) : ''}</td></tr>`);
          }
        }
      }
    }
    body = tbl(['Produk', 'Gudang', 'Batch', 'Rak', 'Masuk', 'Kedaluwarsa', ['Stok', 'n'], ['Nilai', 'n'], 'Aksi'], rows, {
      empty: 'Tidak ada stok atau rak yang cocok.',
      foot: rows.length ? `<tfoot><tr><td colspan="7">Total nilai stok</td><td class="n">${rp(grandTotalVal)}</td><td></td></tr></tfoot>` : ''
    });
  }
  const rks = f.wid ? actR(f.wid) : [];
  return `<div class="toolbar">

function trfForm() {

      } else {

        const picks = Object.entries(l.picks || {}).map(([bid, v]) => ({ batchId: +bid, qty: r4(v) })).filter(x => x.qty > 0);
        const sum = r4(picks.reduce((a, x) => a + x.qty, 0)); const viol = picks.length && fifoViolation(p.id, src.id, picks);

      <label class="chk"><input type="checkbox" data-bind="trf.lines.${i}.manual" data-rr ${l.manual ? 'checked' : ''} ${p ? '' : 'disabled'}> Pilih batch manual</label>

V.manufacturing = () => {
  const f = F;
  const tab = f.mfgTab || 'aktif';
  const kid = f.mfgKitchen ? +f.mfgKitchen : null;
  const prods = (S.productions || []).filter(p => {
    if (tab === 'aktif' && !['terjadwal', 'diproses'].includes(p.status)) return false;
    if (tab === 'selesai' && p.status !== 'selesai') return false;
    if (tab === 'batal' && p.status !== 'batal') return false;
    if (kid && p.kitchenId !== kid) return false;
    return true;
  }).sort((a, b) => b.createdAt - a.createdAt);

  const kpis = {
    sched: (S.productions || []).filter(p => p.status === 'terjadwal').length,
    proc: (S.productions || []).filter(p => p.status === 'diproses').length,
    done: (S.productions || []).filter(p => p.status === 'selesai').length,
    cogs: (S.productions || []).filter(p => p.status === 'selesai').reduce((a, p) => a + (p.cogs || 0), 0)
  };

  const rows = prods.map(p => {
    const bom = BOM(p.bomId);
    const prodObj = P(p.productId);
    const kitchen = KT(p.kitchenId);
    const dstW = W(p.targetWarehouseId);
    const acts = [];

    if (p.status === 'terjadwal') {
      if (can('mfg.plan')) acts.push(btn('Mulai', 'startProd', { id: p.id }, { k: 'sm', perm: 'mfg.plan' }));
      if (can('mfg.exec')) acts.push(btn('Selesaikan', 'openCompleteProd', { id: p.id }, { k: 'sm pri', perm: 'mfg.exec' }));
      if (can('mfg.plan')) acts.push(btn('Batal', 'cancelProd', { id: p.id }, { k: 'sm ghost-bad', perm: 'mfg.plan' }));
    } else if (p.status === 'diproses') {
      if (can('mfg.exec')) acts.push(btn('Selesaikan', 'openCompleteProd', { id: p.id }, { k: 'sm pri', perm: 'mfg.exec' }));
      if (can('mfg.plan')) acts.push(btn('Batal', 'cancelProd', { id: p.id }, { k: 'sm ghost-bad', perm: 'mfg.plan' }));
    } else {
      acts.push(btn('Rincian', 'openProduction', { id: p.id }, { k: 'sm' }));
    }

    const qtyDisp = p.status === 'selesai'
      ? `<strong>${num(p.actualQty)}</strong> ${bom ? bom.yieldUom : ''} <div class="sub">Rencana: ${num(p.planQty)}</div>`
      : `${num(p.planQty)} ${bom ? bom.yieldUom : ''}`;

    const costDisp = p.status === 'selesai'
      ? `<strong>${rp(p.cogs)}</strong><div class="sub">${rp(p.unitCost)} / ${prodObj?.baseUom || 'satuan'}</div>`

      <td><strong>${esc(kitchen ? kitchen.name : '–')}</strong></td>
      <td><strong>${esc(prodObj ? prodObj.name : '–')}</strong><div class="sub">${esc(bom ? bom.name : '')}</div></td>
      <td class="n">${qtyDisp}</td>

  </section>
  <div class="toolbar">
    ${seg('mfgTab', tab, [['aktif', 'Jadwal berjalan'], ['selesai', 'Selesai'], ['batal', 'Batal'], ['semua', 'Semua']])}
    ${fld('Filter dapur', `<select data-bind="mfgKitchen" data-rr>${opt('', 'Semua dapur', f.mfgKitchen)}${actKT().map(k => opt(k.id, k.name, f.mfgKitchen)).join('')}</select>`)}

    ${btn('Buat Jadwal Manufaktur (Planning)', 'newMfgPlan', {}, { k: 'pri', perm: 'mfg.plan' })}

/* Action Handlers for Manufacturing */
A.newMfgPlan = () => {
  const kitchens = actKT();
  const boms = actBOM();
  if (!kitchens.length) fail('Belum ada Dapur yang aktif. Tambahkan master Dapur terlebih dahulu.');
  if (!boms.length) fail('Belum ada Resep (BOM) yang aktif. Tambahkan master Resep (BOM) terlebih dahulu.');

  const initKid = String(kitchens[0].id);
  const matchedBom = boms.find(b => !b.kitchenId || b.kitchenId === +initKid) || boms[0];
  const initKitchen = KT(initKid);

  F.plan = {
    kitchenId: initKid,
    bomId: String(matchedBom?.id || ''),
    planQty: String(matchedBom?.yieldQty || 10),
    scheduledDate: isoDate(Date.now()),
    sourceWarehouseId: String(initKitchen?.warehouseId || ''),
    targetWarehouseId: String(initKitchen?.warehouseId || ''),
    targetRack: '',
    note: ''
  };

  openModal({
    title: 'Perencanaan Manufaktur (Planning)',
    wide: true,
    body: mfgPlanForm,
    foot: () => `<button type="button" class="btn" data-act="closeModal">Batal</button>${btn('Simpan Jadwal Manufaktur', 'saveMfgPlan', {}, { k: 'pri', perm: 'mfg.plan' })}`
  });
};

H.planKitchen = () => {
  const k = KT(F.plan.kitchenId);
  if (k) {
    F.plan.sourceWarehouseId = String(k.warehouseId);
    if (!F.plan.targetWarehouseId) F.plan.targetWarehouseId = String(k.warehouseId);
    const boms = actBOM().filter(b => !b.kitchenId || b.kitchenId === k.id);
    if (boms.length && (!F.plan.bomId || !boms.some(b => b.id === +F.plan.bomId))) {
      F.plan.bomId = String(boms[0].id);
      F.plan.planQty = String(boms[0].yieldQty);
    }
  }
};

H.planBom = () => {
  const b = BOM(F.plan.bomId);
  if (b) {
    F.plan.planQty = String(b.yieldQty);
    if (b.kitchenId) {
      F.plan.kitchenId = String(b.kitchenId);
      H.planKitchen();
    }
  }
};

      ${targetRacks.length ? fld('Rak Tujuan', `<select data-bind="plan.targetRack">${opt('', '– Tanpa rak –', f.targetRack)}${targetRacks.map(r => opt(r.code, `${r.code} (${r.name})`, f.targetRack)).join('')}</select>`) : ''}

A.openProduction = d => {
  const p = MFG(d.id);
  if (!p) return;
  const bom = BOM(p.bomId);
  const prodObj = P(p.productId);
  const kitchen = KT(p.kitchenId);
  const srcW = W(p.sourceWarehouseId);
  const dstW = W(p.targetWarehouseId);

  openModal({
    title: `Jadwal Manufaktur ${p.no}`,
    wide: true,
    body: () => {
      let extraHtml = '';
      if (p.status === 'selesai') {
        const ingRows = (p.ingredientsUsed || []).map(it => `<tr>
          <td><strong>${esc(it.name)}</strong></td>
          <td class="n">${num(it.qtyUsed)} ${esc(it.uom)}</td>
          <td class="n">${rp(it.cogs)}</td>
          <td>${(it.picks || []).map(pk => `<span class="pk mono">${esc(pk.batchNo)}: ${num(pk.qty)}</span>`).join(' ')}</td>
        </tr>`);
        extraHtml = `
        <div style="margin-top:16px">
          <div class="ph"><h3>Hasil Produksi & Bahan Baku Terpakai</h3></div>
          <dl class="meta">
            <div><dt>No. Batch Dihasilkan</dt><dd class="mono"><strong>${esc(p.batchNo)}</strong></dd></div>
            <div><dt>Tgl Kedaluwarsa</dt><dd>${fd(p.expDate)}</dd></div>
            <div><dt>Lokasi Rak Simpan</dt><dd><strong>${esc(p.targetRack || '–')}</strong></dd></div>
            <div><dt>Jumlah Jadi Fisik</dt><dd><strong>${num(p.actualQty)} ${esc(bom?.yieldUom || '')}</strong></dd></div>
            <div><dt>Total HPP Bahan (FIFO)</dt><dd><strong>${rp(p.cogs)}</strong></dd></div>
            <div><dt>HPP per Satuan Dasar</dt><dd><strong>${rp(p.unitCost)} / ${esc(prodObj?.baseUom || '')}</strong></dd></div>
            <div><dt>Diselesaikan Oleh</dt><dd>${esc(p.completedBy)} (${fdt(p.completedAt)})</dd></div>
          </dl>
          ${tbl(['Bahan Baku', ['Jumlah Terpakai', 'n'], ['HPP Bahan', 'n'], 'Batch Sumber FIFO'], ingRows)}
        </div>
        `;
      } else if (bom && ['terjadwal', 'diproses'].includes(p.status)) {
        const calc = calculateBomRequirements(bom, p.planQty, p.sourceWarehouseId);
        const rows = calc.items.map(it => {
          const isOk = it.shortBase <= 1e-9;
          return `<tr>
            <td><strong>${esc(it.product.name)}</strong></td>
            <td class="n">${num(it.reqQty)} ${esc(it.uom)}</td>
            <td class="n">${num(it.availableBase)} ${esc(it.product.baseUom)}</td>
            <td class="n">${rp(it.estCost)}</td>
            <td>${isOk ? chip('Stok Cukup', 'ok') : chip(`Kurang ${num(it.shortBase)} ${it.product.baseUom}`, 'bad')}</td>
          </tr>`;
        });
        extraHtml = `
        <div style="margin-top:16px">
          <div class="ph"><h3>Kesiapan Bahan Baku di ${esc(srcW ? srcW.name : 'Gudang Dapur')}</h3></div>
          ${tbl(['Bahan Baku', ['Kebutuhan', 'n'], ['Tersedia', 'n'], ['Estimasi Biaya', 'n'], 'Status'], rows, {
            foot: `<tfoot><tr><td colspan="3">Estimasi Total Biaya Bahan:</td><td class="n"><strong>${rp(calc.totalEstCost)}</strong></td><td>${calc.allAvailable ? chip('Semua Bahan Siap', 'ok') : chip('Perlu Transfer Bahan', 'warn')}</td></tr></tfoot>`
          })}
        </div>
        `;
      }

      return `
        <dl class="meta">
          <div><dt>Dapur Produksi</dt><dd><strong>${esc(kitchen ? kitchen.name : '–')}</strong></dd></div>
          <div><dt>Produk Jadi</dt><dd><strong>${esc(prodObj ? prodObj.name : '–')}</strong> (${esc(prodObj ? prodObj.code : '')})</dd></div>
          <div><dt>Resep (BOM)</dt><dd>${esc(bom ? bom.name : '–')}</dd></div>
          <div><dt>Tanggal Jadwal</dt><dd>${fd(parseDate(p.scheduledDate))}</dd></div>
          <div><dt>Rencana Hasil</dt><dd><strong>${num(p.planQty)} ${esc(bom?.yieldUom || '')}</strong></dd></div>
          <div><dt>Gudang Asal Bahan</dt><dd>${esc(srcW ? srcW.name : '–')}</dd></div>
          <div><dt>Gudang Simpan Hasil</dt><dd>${esc(dstW ? dstW.name : '–')}</dd></div>
          <div><dt>Status</dt><dd>${st(MFG_ST, p.status)}</dd></div>
        </dl>
        ${p.note ? `<p class="note"><strong>Catatan:</strong> ${esc(p.note)}</p>` : ''}
        ${extraHtml}
      `;
    },
    foot: () => {
      const btns = ['<button type="button" class="btn" data-act="closeModal">Tutup</button>'];
      if (p.status === 'terjadwal') {
        if (can('mfg.plan')) btns.push(btn('Mulai Produksi', 'startProd', { id: p.id }, { k: 'sm', perm: 'mfg.plan' }));
        if (can('mfg.exec')) btns.push(btn('Eksekusi & Selesaikan', 'openCompleteProd', { id: p.id }, { k: 'pri', perm: 'mfg.exec' }));
        if (can('mfg.plan')) btns.push(btn('Batalkan Jadwal', 'cancelProd', { id: p.id }, { k: 'ghost-bad', perm: 'mfg.plan' }));
      } else if (p.status === 'diproses') {
        if (can('mfg.exec')) btns.push(btn('Eksekusi & Selesaikan', 'openCompleteProd', { id: p.id }, { k: 'pri', perm: 'mfg.exec' }));
        if (can('mfg.plan')) btns.push(btn('Batalkan Jadwal', 'cancelProd', { id: p.id }, { k: 'ghost-bad', perm: 'mfg.plan' }));
      }
      return btns.join(' ');
    }
  });
};

A.openCompleteProd = d => {
  const p = MFG(d.id);
  if (!p) return;
  const bom = BOM(p.bomId);
  const prodObj = P(p.productId);
  const kitchen = KT(p.kitchenId);
  const now = new Date();
  const dateStr = String(now.getFullYear()).slice(2) + String(now.getMonth() + 1).padStart(2, '0') + String(now.getDate()).padStart(2, '0');
  const codePrefix = kitchen?.code ? kitchen.code.replace('DPR-', '') : 'MFG';
  const defBatch = `${codePrefix}-${dateStr}${String.fromCharCode(65 + Math.floor(Math.random() * 26))}`;

  const expDays = thrOf(prodObj) || 7;
  const defExp = isoDate(Date.now() + expDays * DAY);

  F.comp = {
    id: p.id,
    actualQty: String(p.planQty),
    batchNo: defBatch,
    expDate: defExp,
    targetWarehouseId: String(p.targetWarehouseId),
    targetRack: p.targetRack || '',
    completionNote: ''
  };

  openModal({
    title: `Eksekusi & Selesaikan: ${p.no}`,
    wide: true,
    body: () => {
      const f = F.comp;
      const targetRacks = f.targetWarehouseId ? actR(f.targetWarehouseId) : [];
      const calc = calculateBomRequirements(bom, f.actualQty, p.sourceWarehouseId);
      const estUnitCost = +f.actualQty > 0 ? Math.round(calc.totalEstCost / (+f.actualQty * uomF(prodObj, bom.yieldUom))) : 0;

      const ingRows = calc.items.map(it => `<tr>
        <td><strong>${esc(it.product.name)}</strong></td>
        <td class="n">${num(it.reqQty)} ${esc(it.uom)}</td>
        <td class="n">${num(it.availableBase)} ${esc(it.product.baseUom)}</td>
        <td class="n">${rp(it.estCost)}</td>
        <td>${it.shortBase <= 1e-9 ? chip('Siap Potong FIFO', 'ok') : chip(`Kurang ${num(it.shortBase)} ${it.product.baseUom}`, 'bad')}</td>
      </tr>`);

      return `
        <dl class="meta">
          <div><dt>Dapur</dt><dd><strong>${esc(kitchen ? kitchen.name : '–')}</strong></dd></div>
          <div><dt>Produk Jadi</dt><dd><strong>${esc(prodObj ? prodObj.name : '–')}</strong></dd></div>
          <div><dt>Resep (BOM)</dt><dd>${esc(bom ? bom.name : '–')}</dd></div>
          <div><dt>Gudang Asal Bahan</dt><dd>${esc(W(p.sourceWarehouseId)?.name || '–')}</dd></div>
        </dl>
        <div class="formrow">
          ${fld(`Hasil Aktual Riil Fisik (${esc(bom?.yieldUom || 'satuan')})`, `<input class="n" type="number" min="0.01" step="any" data-bind="comp.actualQty" data-rr value="${esc(f.actualQty)}">`, 'Bisa berbeda dari target rencana (fleksibel yield)')}
          ${fld('No. Batch Produk Jadi', `<input data-bind="comp.batchNo" value="${esc(f.batchNo)}" maxlength="50" placeholder="contoh: BKR-261028A">`, 'Wajib untuk tracking FIFO & kedaluwarsa')}
          ${fld('Tanggal Kedaluwarsa', `<input type="date" data-bind="comp.expDate" value="${esc(f.expDate)}">`, 'Wajib')}
        </div>
        <div class="formrow">
          ${fld('Gudang Simpan Hasil', whSel('comp.targetWarehouseId', f.targetWarehouseId, actW(), { rr: 1 }), 'Gudang dapur, gudang packing, atau toko cabang', 'grow')}
          ${targetRacks.length ? fld('Rak Penyimpanan', `<select data-bind="comp.targetRack">${opt('', '– Tanpa rak –', f.targetRack)}${targetRacks.map(r => opt(r.code, `${r.code} (${r.name})`, f.targetRack)).join('')}</select>`) : ''}
        </div>
        ${fld('Catatan Penyelesaian (Opsional)', `<input data-bind="comp.completionNote" value="${esc(f.completionNote)}" maxlength="150" placeholder="Contoh: Hasil bagus, tekstur lembut">`)}
        
        <div style="margin-top:14px">
          <div class="ph"><h3>Kalkulasi Bahan Baku Terpakai & Nilai HPP Produk Jadi</h3></div>
          ${tbl(['Bahan Baku', ['Jumlah Terpakai', 'n'], ['Stok Gudang', 'n'], ['Estimasi Biaya', 'n'], 'Status Stok'], ingRows, {
            foot: `<tfoot><tr><td colspan="3">Total Estimasi HPP Bahan Baku:</td><td class="n"><strong>${rp(calc.totalEstCost)}</strong></td><td><strong>~ ${rp(estUnitCost)} / ${esc(prodObj?.baseUom || 'satuan')}</strong></td></tr></tfoot>`
          })}
          ${!calc.allAvailable ? `<div class="alert bad">${ic('alert')} Stok bahan baku tidak mencukupi untuk jumlah aktual ini. Harap transfer bahan terlebih dahulu atau kurangi jumlah produksi.</div>` : ''}
        </div>
      `;
    },
    foot: () => `<button type="button" class="btn" data-act="closeModal">Batal</button>${btn('Konfirmasi & Selesaikan Produksi', 'doCompleteProd', {}, { k: 'pri', perm: 'mfg.exec' })}`
  });
};

V.boms = () => {
  const list = mFilter(S.boms || [], ['code', 'name']);
  const rows = list.map(b => {
    const p = P(b.productId);
    const k = KT(b.kitchenId);
    let estCost = 0;
    (b.lines || []).forEach(l => {
      const ingP = P(l.productId);
      if (ingP) estCost += l.qty * uomF(ingP, l.uom) * (ingP.refPrice || 0);
    });
    return `<tr class="${b.isActive ? '' : 'dim'}">
      <td class="mono"><strong>${esc(b.code)}</strong></td>
      <td><strong>${esc(b.name)}</strong></td>
      <td>${p ? `<strong>${esc(p.name)}</strong> <span class="sub">(${esc(p.code)})</span>` : '–'}</td>
      <td>${k ? esc(k.name) : '<span class="muted">Semua Dapur</span>'}</td>
      <td class="n"><strong>${num(b.yieldQty)} ${esc(b.yieldUom)}</strong></td>
      <td class="n">${b.lines?.length || 0} bahan</td>
      <td class="n">${rp(estCost)} <div class="sub">~ ${rp(b.yieldQty ? estCost / b.yieldQty : 0)} / ${esc(b.yieldUom)}</div></td>
      <td>${activeChip(b)}</td>
      <td class="acts">${btn('Ubah', 'editBom', { id: b.id }, { k: 'sm', perm: 'master' })}${toggleBtn('boms', b, 'master')}</td>
    </tr>`;
  });

  return masterBar(can('master') ? btn('Tambah Resep (BOM)', 'editBom', {}, { k: 'pri', perm: 'master' }) : '')
    + tbl(['Kode BOM', 'Nama Resep', 'Produk Dihasilkan', 'Dapur', ['Standar Hasil', 'n'], ['Komponen', 'n'], ['Estimasi HPP Resep', 'n'], 'Status', ''], rows, { empty: 'Belum ada Resep (BOM) yang terdaftar.' })

/* ================= FORECAST ================= */
function spark(arr) {
  const w = 96, h = 26, max = Math.max(1e-9, ...arr); const step = w / Math.max(1, arr.length - 1);
  const pts = arr.map((v, i) => `${(i * step).toFixed(1)},${(h - 2 - v / max * (h - 4)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`;
}
A.setWin = d => { S.settings.forecastWindow = +d.val; F.fcSel = null; commit(); };
V.forecast = () => {
  const win = S.settings.forecastWindow; const rows = forecast(win).filter(r => prodMatch(r.p, F.fcf)); const st0 = S.settings;
  if (!F.fcSel) { F.fcSel = {}; rows.forEach(r => { if (r.status === 'pesan' && r.recU > 0) F.fcSel[r.p.id] = true; }); }
  const ST = { pesan: ['Pesan sekarang', 'bad'], pantau: ['Pantau', 'warn'], aman: ['Aman', 'ok'] };
  const order = { pesan: 0, pantau: 1, aman: 2 }; rows.sort((a, b) => order[a.status] - order[b.status] || b.rec * b.p.refPrice - a.rec * a.p.refPrice);
  const nSel = rows.filter(r => F.fcSel[r.p.id] && r.recU > 0).length;
  const body = rows.map(r => `<tr><td>${r.recU > 0 ? `<input type="checkbox" aria-label="Pilih ${esc(r.p.name)}" data-bind="fcSel.${r.p.id}" data-rr ${F.fcSel[r.p.id] ? 'checked' : ''}>` : ''}</td><td><div class="pn"><strong>${esc(r.p.name)}</strong><div class="sub">${esc(r.p.code)}, ${esc(SU(r.p.supplierId)?.name || 'tanpa supplier')}</div></div></td><td class="trend">${spark(r.daily.slice(0, -1))}</td><td class="n">${num(r.avg)} <span class="u">${esc(r.p.baseUom)}</span></td><td class="n">${num(r.lt.days, 1)} hari<div class="sub">${esc(r.lt.src)}</div></td><td class="n">${num(r.onHand)}</td><td class="n">${r.oo ? num(r.oo) : '–'}</td><td class="n">${num(r.rop)}</td><td class="n"><strong>${r.recU ? `${num(r.recU)} ${esc(r.p.poUom)}` : '–'}</strong>${r.recU ? `<div class="sub">${num(r.recU * r.f)} ${esc(r.p.baseUom)}</div>` : ''}</td><td>${chip(...ST[r.status])}</td></tr>`);
  return `<div class="toolbar"><div class="fld"><span>Jendela moving average</span><div class="seg">${[30, 60, 90].map(v => `<button type="button" data-act="setWin" data-val="${v}" aria-pressed="${win === v}">${v} hari</button>`).join('')}</div></div><div class="sp"></div>${btn(`Buat draft PO (${nSel})`, 'fcToPO', {}, { k: 'pri', perm: 'po' })}</div>
  <div class="toolbar filters">${prodFilters('fcf')}${(F.fcf.c1 || F.fcf.type || F.fcf.brand) ? btn('Hapus filter', 'clearProdF', { k: 'fcf' }, { k: 'sm' }) : ''}</div>
  <div class="formula">Rekomendasi = pemakaian harian × (lead time + safety ${st0.safetyDays} hari + cakupan ${st0.coverDays} hari) − stok jaringan − barang dalam PO. Dibulatkan ke satuan beli. Titik pesan ulang = pemakaian harian × (lead time + safety).</div>
  ${tbl(['', 'Produk', `Tren ${win} hari`, ['Pemakaian/hari', 'n'], ['Lead time', 'n'], ['Stok jaringan', 'n'], ['Dalam PO', 'n'], ['Titik pesan', 'n'], ['Rekomendasi', 'n'], 'Status'], body)}
  <p class="note">Angka ini usulan. Purchasing tetap meninjau jumlah dan harga di draft PO sebelum dikirim ke supplier.</p>`;
};
A.fcToPO = () => { const vis = new Set(forecast(S.settings.forecastWindow).filter(r => prodMatch(r.p, F.fcf)).map(r => r.p.id)); const ids = Object.entries(F.fcSel || {}).filter(([k, v]) => v && vis.has(+k)).map(([k]) => +k); const pos = posFromForecast(ids, S.settings.forecastWindow); F.fcSel = null; F.poTab = 'aktif'; S.ui.page = 'po'; commit(`${pos.length} draft PO dibuat: ${pos.map(p => p.no).join(', ')}.`); };

/* ================= PURCHASE ORDER ================= */
V.po = () => {
  const tab = F.poTab; const list = S.pos.filter(p => tab === 'aktif' ? ['draft', 'dipesan'].includes(p.status) : !['draft', 'dipesan'].includes(p.status)).sort((a, b) => b.createdAt - a.createdAt);

  return `<div class="toolbar">${seg('poTab', tab, [['aktif', 'Berjalan'], ['selesai', 'Selesai & batal']])}<div class="sp"></div>${btn('Buat PO', 'newPO', {}, { k: 'pri', perm: 'po' })}</div>
  ${tbl(['No.', 'Supplier', ['Barang', 'n'], ['Total', 'n'], 'Status', 'Dipesan', 'Diterima'], rows, { empty: 'Tidak ada PO di tab ini.' })}`;
};
const lineDev = l => { const p = P(l.productId); if (!p || !p.refPrice) return 0; return ((+l.price * (1 - (+l.disc || 0) / 100)) / (l.factor || uomF(p, l.uom)) - p.refPrice) / p.refPrice * 100; };
const poAnom = po => po.lines.some(l => Math.abs(lineDev(l)) > S.settings.priceTolerance);
A.newPO = d => {
  const po = d?.id ? byId(S.pos, d.id) : null;
  F.po = po ? { id: po.id, supplierId: String(po.supplierId), note: po.note, lines: po.lines.map(l => ({ productId: String(l.productId), uom: l.uom, qty: String(l.qty), price: String(l.price), disc: String(l.disc || 0), src: '' })) } : { id: null, supplierId: '', note: '', lines: [{ productId: '', uom: '', qty: '', price: '', disc: '0', src: '' }] };
  openModal({ title: po ? `Ubah ${po.no}` : 'Purchase order baru', wide: true, body: poForm, foot: () => `<button type="button" class="btn" data-act="closeModal">Batal</button>${btn('Simpan draft', 'poSave', {}, { k: 'pri', perm: 'po' })}` });
};
H.poProd = d => { const l = F.po.lines[d.i]; const p = P(l.productId); if (p) { l.uom = p.poUom; const lp = lastPrice(p.id, l.uom); l.price = String(lp.price); l.src = lp.src; if (!F.po.supplierId && p.supplierId) F.po.supplierId = String(p.supplierId); } };
H.poUom = d => { const l = F.po.lines[d.i]; const lp = lastPrice(l.productId, l.uom); l.price = String(lp.price); l.src = lp.src; };
A.poAdd = () => { F.po.lines.push({ productId: '', uom: '', qty: '', price: '', disc: '0', src: '' }); refresh(); };
A.poDel = d => { F.po.lines.splice(+d.i, 1); refresh(); };
function poForm() {
  const f = F.po; let total = 0;
  const sid = +f.supplierId; const prods = actP().slice().sort((a, b) => (b.supplierId === sid) - (a.supplierId === sid) || a.name.localeCompare(b.name));
  const rows = f.lines.map((l, i) => {
    const p = P(l.productId); const sub = (+l.qty || 0) * (+l.price || 0) * (1 - (+l.disc || 0) / 100); total += sub;
    const dev = p ? lineDev({ ...l, factor: uomF(p, l.uom) }) : 0;
    return `<tr><td><select aria-label="Produk" data-bind="po.lines.${i}.productId" data-hook="poProd" data-i="${i}" data-rr>${opt('', 'Pilih produk', l.productId)}${prods.map(x => opt(x.id, `${x.code} ${x.name}${x.supplierId === sid ? '' : ' (supplier lain)'}`, l.productId)).join('')}</select></td>
    <td><select aria-label="Satuan" data-bind="po.lines.${i}.uom" data-hook="poUom" data-i="${i}" data-rr ${p ? '' : 'disabled'}>${p ? uoms(p).map(u => opt(u.name, u.factor === 1 ? u.name : `${u.name} (${num(u.factor)} ${p.baseUom})`, l.uom)).join('') : '<option>–</option>'}</select></td>
    <td><input aria-label="Jumlah" class="n" type="number" min="0" step="any" data-bind="po.lines.${i}.qty" data-rr value="${esc(l.qty)}"></td>
